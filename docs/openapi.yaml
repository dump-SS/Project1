  /plans:
    post:
      tags: [学习计划]
      operationId: createPlan
      summary: 生成学习计划 ②
      description: |
        语义是「请求生成一份计划」。服务端规则引擎结合最近一次状态评估决定任务强度，同步返回，不走 LLM
        （PRD 8.2：AI 不可用时仍能看计划）。同一 planDate 已有计划时返回 409，可传 regenerate=true 覆盖。
        新用户无历史数据时 adaptedFrom 为 null，走规则模板生成。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
            example:
              planDate: '2026-08-16'
              availableMinutes: 120
              goalIds: [g_5501]
      responses:
        '201':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              example:
                planId: p_9001
                planDate: '2026-08-16'
                availableMinutes: 120
                adaptedFrom:
                  assessmentId: a_7742
                  stateLabel: fatigue_warning
                  adjustment: reduce_load
                  note: 最近状态偏疲劳，本次总时长下调，单任务时长缩短并增加间隔
                tasks:
                  - taskId: t_30011
                    subject: math
                    topic: 函数图像与性质 · 巩固已学
                    estimatedMinutes: 40
                    priority: 1
                    status: pending
                    goalId: g_5501
                  - taskId: t_30012
                    subject: english
                    topic: 单词短时高频复习
                    estimatedMinutes: 20
                    priority: 2
                    status: pending
                    goalId: null
                createdAt: '2026-08-16T18:00:00+08:00'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GuardianAuthorizationExpired'
        '409':
          description: 同一 planDate 已存在计划，可传 regenerate=true 覆盖
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: STATE_CONFLICT
                  message: 当日已存在计划，如需覆盖请传 regenerate=true
    get:
      tags: [学习计划]
      operationId: listPlans
      summary: 计划列表
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: dateFrom
          in: query
          required: false
          description: 默认最近 7 天
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: 默认最近 7 天
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 计划列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
              example:
                items:
                  - planId: p_9001
                    planDate: '2026-08-16'
                    availableMinutes: 120
                    adaptedFrom: null
                    tasks:
                      - taskId: t_30011
                        subject: math
                        topic: 函数图像与性质 · 巩固已学
                        estimatedMinutes: 40
                        priority: 1
                        status: pending
                        goalId: g_5501
                    createdAt: '2026-08-16T18:00:00+08:00'
                pagination:
                  page: 1
                  pageSize: 20
                  total: 7
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

