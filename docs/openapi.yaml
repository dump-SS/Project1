                    periodStart: '2026-08-10'
                    periodEnd: '2026-08-16'
                    generation:
                      status: ready
                      source: llm
                      completedAt: '2026-08-16T22:00:12+08:00'
                    content:
                      overview: 这周数学从「高效稳定」滑到了「疲劳预警」，主要发生在周四之后；英语记录太少，暂时看不出趋势。
                      patterns:
