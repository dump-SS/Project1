      operationId: matchKnowledgePoints
      summary: 文本 → 候选知识点 Top-K
      description: |
        错题录入第四步使用。优先走本地 embedding 余弦 Top-5；
        向量库/embedding 未就绪时降级为名称关键词模糊匹配（接口形态不变）。
        出域边界：匹配仅在本机计算，不调用云端 LLM。
      parameters:
        - name: text
          in: query
          required: true
          description: 待匹配文本（题目/错因摘要，≤4000 字）
          schema:
            type: string
            maxLength: 4000
        - name: subject
          in: query
          required: false
          description: 限定学科代码，缺省跨学科
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 5，上限 10
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: 候选知识点
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePointMatchList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

