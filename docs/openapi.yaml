          in: query
          required: false
          description: 结束日期 YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 时间序列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasteryTimeline'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== 板块二：知识复盘（PRD 12.3.5） ====================
  /knowledge-summary:
    post:
      tags: [知识复盘]
      operationId: createKnowledgeSummary
      summary: 生成学科知识复盘（异步，RAG + EgressGuard + 审核层）
      description: |
        改造自旧的无状态文案接口：加 current_user 鉴权、结构化入参（periodStart/End/subject 必填）、
        异步生成、落 summaries 表（dimension=knowledge）。LLM 输入仅含 knowledge_aggregated
        白名单字段（检索片段元信息/掌握度数值/状态摘要），原文永不出域。生成中返回 pending 句柄轮询。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSummaryCreate'
      responses:
        '202':
          description: 已受理，异步生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryPending'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [知识复盘]
      operationId: listKnowledgeSummaries
      summary: 知识复盘列表（summary-review 知识 tab 数据源）
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Subject'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 复盘列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /knowledge-summary/{summaryId}:
    get:
      tags: [知识复盘]
      operationId: getKnowledgeSummary
      summary: 知识复盘详情（dimension=knowledge）
      parameters:
        - $ref: '#/components/parameters/SummaryId'
      responses:
        '200':
          description: 复盘详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== 板块二：错题归因（合规改造，原文不出域） ====================
  /error-parse:
    post:
      tags: [错题本]
      operationId: parseErrorRecord
      summary: 错题归因分析（RAG 合规形态：LLM 只看检索片段与错因候选，不看原文）
      description: |
        替代旧版「原文直发云端」的违规形态。入参引用已入库错题（errorId），
        后端本地检索相关知识点片段 + 生成错因候选枚举，出域内容仅为 knowledge_aggregated
        白名单字段（知识点名称/定义/易错点 + 结构化错因候选），由 EgressGuard 强校验。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorParseRequest'
      responses:
        '200':
          description: 归因分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorParseResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== 契约漂移补录（板块一在用接口，此前未入契约） ====================
  /daily-summary:
    get:
      tags: [学习总结与复盘]
      operationId: getDailySummary
      summary: 单日一句话学习总结
      parameters:
        - name: date
          in: query
          required: true
          description: 日期 YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 日总结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/weight-config:
    get:
      tags: [用户与设置]
      operationId: getWeightConfig
      summary: 读取当前权重 + 最近调权日志
      responses:
        '200':
          description: 权重配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightConfig'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/weight-config/tune-now:
    post:
      tags: [用户与设置]
      operationId: tuneWeightsNow
      summary: 手动触发一次调权（演示用）
      responses:
        '200':
          description: 调权结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuneNowResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/state-breakdown:
    get:
      tags: [用户与设置]
      operationId: getStateBreakdown
      summary: 按当前权重计算的窗口分 + 子分贡献分解
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Subject'
      responses:
        '200':
          description: 状态分解
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateBreakdown'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recommendation-content:
    get:
      tags: [个性化建议]
      operationId: getRecommendationContent
      summary: 导学计划页学习内容推荐（LLM 驱动）
      responses:
        '200':
          description: 推荐内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== 板块三：群体匿名参照（M1 契约转正 · 口径 module3-m0-decision-proposal.md v1.7 §4.11） ====================
  # POST /community/features 已按 M0 决议废弃（§4.7 每周自动参与 + §3 A2 服务端抽取为唯一真源）：
  # 用户一次性授权后，由服务端抽取 job 按授权状态自动纳入当周数据，客户端不再上传特征值。

  /community/aggregate:
    get:
      tags: [群体参照]
      operationId: getCommunityAggregate
      summary: 当前周期群体聚合统计（只发聚合，不发个体）
      description: |
        只下发服务端物化的分位数/直方图桶；k≥20 时返回 poolSize + 聚合结果，不足 k 返回
        COMMUNITY_INSUFFICIENT_POOL 且响应体不含任何数值。period 固化为当前 ISO 周，不作为查询参数；
        第一批聚合维度 = metric × stage（§4.1，不含 subject）。未授权返回 COMMUNITY_CONSENT_REQUIRED。
        限频：每用户每分钟 5 次，超限 RATE_LIMITED（§4.8）。
      parameters:
        - name: stage
          in: query
          required: true
          description: 学段（junior=初中 / senior=高中）
          schema:
            $ref: '#/components/schemas/CommunityStage'
        - name: metric
          in: query
          required: true
          description: 聚合指标
          schema:
            $ref: '#/components/schemas/CommunityMetric'
      responses:
        '200':
          description: 当前周期聚合结果（仅 k≥20 时）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityAggregate'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 未开启匿名聚合授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: COMMUNITY_CONSENT_REQUIRED
                  message: 开启匿名聚合授权后才能查看群体参照
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: 聚合池样本不足（k<20），响应体不含任何数值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: COMMUNITY_INSUFFICIENT_POOL
                  message: 群体数据积累中，暂不展示对比

  /me/community-consent:
    get:
      tags: [用户与设置]
      operationId: getCommunityConsent
      summary: 读取匿名聚合授权状态
      responses:
        '200':
          description: 授权状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityConsent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [用户与设置]
      operationId: putCommunityConsent
      summary: 开启 / 撤回匿名聚合授权（显式授权动作，PRD 10.3）
      description: |
        enabled=true 为显式开启（一次性授权后由服务端抽取 job 按授权状态自动纳入当周数据，
        即「每周自动参与」，§4.7 决议）；enabled=false 为撤回：按匿名参与 ID 物理删除全部
        历史特征行，延迟批量重算（≤24h）后退出聚合池（§4.5）。监护人授权失效时写接口 403。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityConsentUpdate'
      responses:
        '200':
          description: 更新后的授权状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityConsent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GuardianAuthorizationExpired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/usage:
    get:
      tags: [pilot 运营与治理]
      operationId: getMyUsage
      summary: 只读用量查询（按月返回当前用户的模型数值成本流水与合计）
      description: |
        用量页数据源（D38/#9）。**只读，无任何支付/充值语义**——支付整体推迟到 pilot 结束后。
        返回 usage_ledger 流水（只存数值，不含任何提示词或输出内容）与区间合计；
        month 缺省为当前月。与刻意去身份化的 AICallLog 分两套，不合并。
      parameters:
        - name: month
          in: query
          required: false
          description: 查询月份 YYYY-MM；缺省为当前月
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: 区间内用量流水与合计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageLedgerList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /error-reports:
    post:
      tags: [pilot 运营与治理]
      operationId: createErrorReport
      summary: 用户报错（设置常驻入口 messageId=null；消息级按钮带 messageId 与上下文）
      description: |
        #46 两处入口共用的后端。消息级报错必须带上下文（哪条消息、什么意图），
        context 只放结构化快照，**不含对话原文流水**（与 D45 原文短期留存口径分开）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorReportCreate'
      responses:
        '201':
          description: 报错已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReport'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/violations:
    get:
      tags: [pilot 运营与治理]
      operationId: getMyViolations
      summary: 本人违规处置留痕（warn / temp_ban / perm_ban，按时间倒序）
      description: |
        #43 分级处置（1 次警告 → 3 次临时封禁 → 永久）必须留痕；本人可查自己的处置记录。
        reason 只含命中类型，不含用户原文。
      responses:
        '200':
          description: 处置留痕列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViolationLogList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/medals:
    get:
      tags: [pilot 运营与治理]
      operationId: getMyMedals
      summary: 本人已获得奖章（#49 最小版：里程碑见 MedalMilestone，未获得的不返回）
      description: |
        虚拟奖章最小版，只列已获得里程碑。**不做积分商城 / 排行榜**
        （排行榜与 §4.5「社区不做社交」冲突）。
      responses:
        '200':
          description: 已获得奖章列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedalList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /analytics/events:
    post:
      tags: [pilot 运营与治理]
      operationId: createAnalyticsEvent
      summary: 结构化埋点事件上报（D39 三块；不含对话原文流水，payload 入库前脱敏）
      description: |
        D39 三块埋点统一上报口：chat_interaction（Chat 交互）/ ai_quality（AI 质量反馈）/
        profile_trace（画像 trace）。**与对话原文的口径不可混同**：本接口只收结构化事件
        （意图判定结果、卡片事件、锚定结果、提取事件…），不含对话原文流水；
        payload 入库前经 privacy_filter 脱敏，身份只走服务端会话，不进 payload。
        id / createdAt 由服务端生成；响应返回脱敏后实际落库的内容。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventCreate'
      responses:
        '201':
          description: 事件已落库（返回脱敏后的实际存储内容）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsEvent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: |
        HttpOnly Session Cookie（名为 sid），登录成功后由服务端 Set-Cookie 下发，
        有效期 7 天（见 mock-server SESSION_TTL_MS）。浏览器自动携带，前端无需手动设置。
        鉴权失效时业务接口返回 401 UNAUTHENTICATED。
        （历史说明：早期契约曾假设上游 Bearer token 且不含登录/注册接口，
        实际项目改为自带 /auth/* 会话体系，本契约已据此收录，见「鉴权会话」标签。）

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，默认 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数，默认 20，上限 50
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选幂等键，24 小时内重复键直接返回首次结果（用于弱网下重复提交学习记录）
      schema:
        type: string
    GoalId:
      name: goalId
      in: path
      required: true
      description: 目标 ID
      schema:
        type: string
    PlanId:
      name: planId
      in: path
      required: true
      description: 计划 ID
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      description: 计划内任务 ID
      schema:
        type: string
    RecordId:
      name: recordId
      in: path
      required: true
      description: 学习记录 ID
      schema:
        type: string
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      description: 状态评估 ID
      schema:
        type: string
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      description: 建议 ID
      schema:
        type: string
    SummaryId:
      name: summaryId
      in: path
      required: true
      description: 复盘 ID
      schema:
        type: string

  responses:
    ValidationFailed:
      description: 参数缺失或取值越界
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: 自评专注度必须为 1-5 的整数
              field: selfReport.focus
    Unauthenticated:
      description: token 缺失或过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: 登录状态已失效，请重新登录
    GuardianAuthorizationExpired:
      description: 监护人授权失效，账号只读（PRD 8.1），仅 GET 可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GUARDIAN_AUTHORIZATION_EXPIRED
              message: 监护人授权已过期，请重新确认后继续使用
    NotFound:
      description: 资源不存在或不属于当前用户
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: 资源不存在
    RateLimited:
      description: 手动触发 AI 生成超频（PRD 6.4 控成本）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: 今日手动生成次数已达上限，请明天再试
    InternalServerError:
      description: 服务端错误。对齐 api-design-unified.md 0.2 节错误码表中的 500 INTERNAL_ERROR。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: 服务开小差了，请稍后再试
    EmailNotRegistered:
      description: 邮箱尚未注册（登录 / 找回密码 / 发码时）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: EMAIL_NOT_REGISTERED
              message: 该邮箱尚未注册，请先注册
              field: email
    KbTextTooLong:
      description: 错题原文超过 4000 字上限（PRD 12.3.2）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: KB_TEXT_TOO_LONG
              message: 错题文本过长，请精简到 4000 字以内
              field: rawText
    KbEmbeddingFailed:
      description: 本地 embedding 不可用，录入可降级为手动选知识点
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: KB_EMBEDDING_FAILED
              message: 知识点匹配服务暂不可用，请手动选择知识点
    KbInsufficientMasteryData:
      description: 掌握度样本不足（<3），不下数值结论
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: KB_INSUFFICIENT_MASTERY_DATA
              message: 该知识点样本不足，继续积累后会生成掌握度

  schemas:
    # ---------- 枚举字典（PRD 0.4） ----------
    Subject:
      type: string
      description: 学科代码（拼音首字母大写，与知识点库标准对齐；other 保留兜底）。YW 语文 / SX 数学 / YY 英语 / WL 物理 / HX 化学 / SW 生物 / ZZ 思想政治 / LS 历史 / DL 地理
      enum: [YW, SX, YY, WL, HX, SW, ZZ, LS, DL, other]
    Stage:
      type: string
      description: 学段：junior=初中，senior=高中
      enum: [junior, senior]
    GoalType:
      type: string
      description: 目标类型
      enum: [short_term, long_term]
    TaskStatus:
      type: string
      description: 任务状态
      enum: [pending, completed, partial, abandoned]
    Completion:
      type: string
      description: 任务完成度（无 pending）
      enum: [completed, partial, abandoned]
    Emotion:
      type: string
      description: 情绪状态
      enum: [positive, neutral, negative]
    DifficultyFeel:
      type: string
      description: 难度主观感受
      enum: [easy, moderate, hard]
    Trend:
      type: string
      description: 状态变化趋势
      enum: [up, flat, down]
    StateLabel:
      type: string
      description: 状态标签；insufficient_data 表示数据不足不下结论
      enum: [efficient_stable, fatigue_warning, emotion_blocked, fluctuating_up, insufficient_data]
    RecScene:
      type: string
      description: 建议场景：post_session=单次学习后，weekly_review=阶段回顾，post_session_knowledge=内容维度建议（板块二 v2.2）
      enum: [post_session, weekly_review, post_session_knowledge]
    GenerationSource:
      type: string
      description: 生成来源：llm=模型生成，template=模板兜底
      enum: [llm, template]
    Rating:
      type: string
      description: 有用性评级
      enum: [useful, neutral, not_useful]

    # ---------- 鉴权会话（对齐 mock-server/server.js 与 authApi.js） ----------
    OkResponse:
      type: object
      description: auth 类接口的通用成功响应
      required: [ok]
      properties:
        ok:
          type: boolean
          description: 恒为 true
    EmailOnlyRequest:
      type: object
      description: 仅需邮箱的请求（发送各类验证码）
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
    RegisterRequest:
      type: object
      description: 注册请求
      required: [email, code, password, confirmPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
          description: 6 位数字验证码
        password:
          type: string
          minLength: 6
          maxLength: 32
          description: 6-32 位，需含大写/小写/数字/符号中至少两类
        confirmPassword:
          type: string
          description: 需与 password 一致
    LoginByCodeRequest:
      type: object
      description: 邮箱验证码登录 / 校验重置码请求
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
    LoginByPasswordRequest:
      type: object
      description: 邮箱密码登录请求
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ResetPasswordRequest:
      type: object
      description: 重置密码请求（找回密码第二步）
      required: [email, code, newPassword, confirmPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
        newPassword:
          type: string
          minLength: 6
          maxLength: 32
        confirmPassword:
          type: string
    AuthMeResponse:
      type: object
      description: GET /auth/me 的响应
      required: [ok, user]
      properties:
        ok:
          type: boolean
        user:
          type: object
          required: [email]
          properties:
            email:
              type: string
              format: email
              description: 登录凭证邮箱（可改、可换绑；仅用于认证与展示，不作为身份标识）
            userId:
              type: string
              description: 稳定用户 ID，与 User.userId 同源（D59；前端展示当前仍用 email）

    # ---------- 通用结构 ----------
    Error:
      type: object
      description: 统一错误格式
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 错误码
            message:
              type: string
              description: 可展示的错误说明
            field:
              type: string
              description: 校验失败的字段路径，仅参数校验错误时出现
    Pagination:
      type: object
      description: 列表响应的分页信息
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总条数
    GenerationStatus:
      type: object
      description: |
        AI 异步生成状态。终态为 ready / insufficient_data / failed；非终态 pending。
        两类资源的兜底语义不同（api-design-unified.md 0.3 节）：
        - 建议（Recommendation）：LLM 失败时降级为 template 兜底并仍返回 ready，
          generation.source = template。**不应出现 failed**——任何情况下用户都拿得到内容。
        - 复盘（Summary）：不做模板兜底，LLM 失败即 failed，提示稍后再试。
          **不应出现 source = template**。
        本 schema 为两者共用的超集；实现方需按资源类型约束上述互斥组合，
        调用方渲染时以资源类型 + status + source 三者共同判断。
      required: [status]
      properties:
        status:
          type: string
          description: 生成状态
          enum: [pending, ready, insufficient_data, failed]
        source:
          $ref: '#/components/schemas/GenerationSource'
        completedAt:
          type: string
          format: date-time
          description: 生成完成时间，终态时出现
    RatingFeedback:
      type: object
      description: 建议 / 复盘的有用性反馈请求体
      required: [rating]
      properties:
        rating:
          $ref: '#/components/schemas/Rating'
        reason:
          type: string
          maxLength: 100
          nullable: true
          description: 可选，≤100 字，补充为什么不准
    FeedbackRecord:
      type: object
      description: 已提交的反馈
      required: [rating, submittedAt]
      properties:
        rating:
          $ref: '#/components/schemas/Rating'
        reason:
          type: string
          nullable: true
          description: 用户补充说明
        submittedAt:
          type: string
          format: date-time
          description: 提交时间

    # ---------- 用户与设置 ----------
    User:
      type: object
      description: 当前用户资料
      required: [userId, stage, grade, subjects, guardianAuthorization, onboardingCompleted]
      properties:
        userId:
          type: string
          description: >-
            稳定用户 ID（`u_` 前缀短码）。与登录凭证解耦——改邮箱、换绑、换设备均不变，
            是所有业务表外键指向的内部主键（D59 三层身份：内部主键 / 登录凭证 / 对外标识）。
            注意：它不是邮箱。
        stage:
          $ref: '#/components/schemas/Stage'
        grade:
          type: string
          description: 年级，如「初二」「高二」
        subjects:
          type: array
          description: 学科列表
          items:
            $ref: '#/components/schemas/Subject'
        guardianAuthorization:
          type: object
          description: 监护人授权状态
          required: [status]
          properties:
            status:
              type: string
              description: 授权状态
              enum: [pending, active, revoked, expired]
            expiresAt:
              type: string
              format: date-time
              description: 授权到期时间
        onboardingCompleted:
          type: boolean
          description: 是否已完成建档引导
    UserProfilePut:
      type: object
      description: 幂等建档请求体，字段全必填
      required: [stage, grade, subjects]
      properties:
        stage:
          $ref: '#/components/schemas/Stage'
        grade:
          type: string
          description: 年级，如「初二」「高二」
        subjects:
          type: array
          description: 学科枚举数组，1-10 项（Subject 枚举共 10 个取值，允许全选）
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Subject'
    UserProfilePatch:
      type: object
      description: 局部更新请求体，字段全可选
      properties:
        stage:
          $ref: '#/components/schemas/Stage'
        grade:
          type: string
          description: 年级，如「初二」「高二」
        subjects:
          type: array
          description: 学科枚举数组，1-10 项（Subject 枚举共 10 个取值，允许全选）
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Subject'
    Settings:
      type: object
      description: 用户设置。权重数值（α、β 及各子权重）不通过任何用户侧接口暴露（PRD 5.2）
      required: [aiWeightTuningEnabled, sendTextToAI, knowledgeAiEgressEnabled, updatedAt]
      properties:
        aiWeightTuningEnabled:
          type: boolean
          description: 是否启用 AI 自动调权，默认 true；关闭后固定使用默认权重
        sendTextToAI:
          type: boolean
          description: 是否允许自由文本出域，默认 false；关闭时仅用结构化特征生成
        knowledgeAiEgressEnabled:
          type: boolean
          description: 是否允许知识复盘 AI 出域（PRD 12.6），默认 false；关闭时知识复盘走本地规则模板
        updatedAt:
          type: string
          format: date-time
          description: 最近更新时间
    SettingsUpdate:
      type: object
      description: 设置更新请求体，至少传一项
      minProperties: 1
      properties:
        aiWeightTuningEnabled:
          type: boolean
          description: 默认 true；关闭后固定使用默认权重
        sendTextToAI:
          type: boolean
          description: 默认 false；关闭时目标描述等自由文本不出域，仅用结构化特征生成
        knowledgeAiEgressEnabled:
          type: boolean
          description: 默认 false；开启后知识复盘可用云端 LLM（经 EgressGuard 白名单）
    GuardianAuthorizationRequest:
      type: object
      description: 监护人邮箱与手机号二选一必填
      minProperties: 1
      properties:
        guardianEmail:
          type: string
          description: 监护人邮箱（与 guardianPhone 二选一）
        guardianPhone:
          type: string
          description: 监护人手机号（与 guardianEmail 二选一）

    # ---------- 学习目标 ----------
    GoalProgress:
      type: object
      description: 目标进度
      required: [plannedTasks, completedTasks, ratio]
      properties:
        plannedTasks:
          type: integer
          description: 已规划任务数
        completedTasks:
          type: integer
          description: 已完成任务数
        ratio:
          type: number
          description: 完成比例
    Goal:
      type: object
      description: 学习目标
      required: [goalId, type, subject, title, status, progress, createdAt]
      properties:
        goalId:
          type: string
          description: 目标 ID
        type:
          $ref: '#/components/schemas/GoalType'
        subject:
          $ref: '#/components/schemas/Subject'
        title:
          type: string
          description: 目标标题
        description:
          type: string
          nullable: true
          description: 目标补充描述
        targetDate:
          type: string
          format: date
          nullable: true
          description: 目标日期
        status:
          type: string
          description: 目标状态
          enum: [active, archived]
        outcome:
          type: string
          nullable: true
          description: |
            归档终态，仅 status=archived 时有值；active 时为 null。
            用于区分「已达成 / 已放弃 / 已过期」——status 的 active/archived 二值无法表达这个区分。
            前端已按可选字段读取（goals.ts），后端补齐前保持返回 null 即可，向后兼容。
          enum: [achieved, abandoned, expired]
        completionNote:
          type: string
          maxLength: 200
          nullable: true
          description: 目标完成总结（归档时可填），≤200 字；前端已按可选字段读取
        pointIds:
          type: array
          description: 目标绑定的知识点 ID（v2.2，可选，用于「建议先补」短板提示）
          items:
            type: string
        parentGoalId:
          type: string
          nullable: true
          description: >-
            父目标 ID（D6/D29：长期目标下挂多个短期子目标，父子树）。顶层目标为 null。
            注意 status 的 enum 不得改动（active/archived 被 ?status= 过滤依赖），
            父子关系用平行字段表达。
        examId:
          type: string
          nullable: true
          description: >-
            引用的考试 ID（D49）。用 examId + targetScore 表达「这次考到 X 分」，
            避免与 Exam 形成两套平行的目标体系。
        targetScore:
          type: number
          nullable: true
          description: 目标分数（配合 examId 使用；满分取该考试的 fullScore）
        progress:
          $ref: '#/components/schemas/GoalProgress'
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    GoalSummary:
      type: object
      description: 列表中的目标条目
      required: [goalId, type, subject, title, status, progress]
      properties:
        goalId:
          type: string
          description: 目标 ID
        type:
          $ref: '#/components/schemas/GoalType'
        subject:
          $ref: '#/components/schemas/Subject'
        title:
          type: string
          description: 目标标题
        targetDate:
          type: string
          format: date
          nullable: true
          description: 目标日期
        status:
          type: string
          description: 目标状态
          enum: [active, archived]
        outcome:
          type: string
          nullable: true
          description: 归档终态，仅 archived 时有值；取值同 Goal.outcome
          enum: [achieved, abandoned, expired]
        completionNote:
          type: string
          maxLength: 200
          nullable: true
          description: 目标完成总结；取值同 Goal.completionNote
        parentGoalId:
          type: string
          nullable: true
          description: 父目标 ID（D6 父子树，侧面板按此缩进；顶层为 null）
        examId:
          type: string
          nullable: true
          description: 关联考试 ID（D49）
        targetScore:
          type: number
          nullable: true
          description: 目标分数（配合 examId）
        progress:
          $ref: '#/components/schemas/GoalProgress'
    GoalCreate:
      type: object
      description: 创建目标请求体
      required: [type, subject, title]
      properties:
        type:
          $ref: '#/components/schemas/GoalType'
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          description: 所属学科，跨学科目标填 other
        title:
          type: string
          maxLength: 50
          description: ≤50 字，如「两周后期中考试数学 120+」
        description:
          type: string
          maxLength: 200
          description: 可选，≤200 字自由文本，出域受 sendTextToAI 控制
        targetDate:
          type: string
          format: date
          description: 可选，短期目标建议必填
        templateId:
          type: string
          description: 可选，从预设模板创建时带上
        pointIds:
          type: array
          description: >-
            可选，目标绑定的知识点 ID（与 Goal.pointIds 同源）。⚠️ 补齐既有缺口：
            `goals.point_ids` 列早已存在（v2.2），但创建/更新请求体此前都没有这个字段，
            等于建目标时根本传不进来，只能一直是空。
          items:
            type: string
        parentGoalId:
          type: string
          nullable: true
          description: 可选，父目标 ID（D6 父子树；不传即顶层目标）
        examId:
          type: string
          nullable: true
          description: 可选，关联考试 ID（D49）
        targetScore:
          type: number
          nullable: true
          description: 可选，目标分数（配合 examId）
    GoalUpdate:
      type: object
      description: 更新 / 归档目标请求体，字段全可选
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 50
          description: 目标标题
        description:
          type: string
          maxLength: 200
          description: 目标补充描述
        targetDate:
          type: string
          format: date
          description: 目标日期
        status:
          type: string
          description: active / archived（归档代替删除）
          enum: [active, archived]
        pointIds:
          type: array
          description: 可选，目标绑定的知识点 ID（全量覆盖；传空数组表示清空绑定）
          items:
            type: string
        parentGoalId:
          type: string
          nullable: true
          description: 父目标 ID（D6 父子树）；传 null 表示提升为顶层目标
        examId:
          type: string
          nullable: true
          description: 关联考试 ID（D49）
        targetScore:
          type: number
          nullable: true
          description: 目标分数（配合 examId）
    GoalList:
      type: object
      description: 目标列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GoalSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ---------- 学习计划 ----------
    PlanTask:
      type: object
      description: 计划内的单个任务
      required: [taskId, subject, topic, estimatedMinutes, priority, status]
      properties:
        taskId:
          type: string
          description: 任务 ID
        subject:
          $ref: '#/components/schemas/Subject'
        topic:
          type: string
          description: 内容方向，颗粒度到「学科 + 方向」，不含具体题目
        estimatedMinutes:
          type: integer
          description: 预计时长（分钟）
        priority:
          type: integer
          description: 优先级，数字越小越靠前
        status:
          $ref: '#/components/schemas/TaskStatus'
        goalId:
          type: string
          nullable: true
          description: 关联目标 ID；无关联时为 null
    PlanTaskDetail:
      allOf:
        - $ref: '#/components/schemas/PlanTask'
        - type: object
          description: 任务调整后的返回结构
          required: [removed, userAdjusted, updatedAt]
          properties:
            removed:
              type: boolean
              description: 是否已被用户删除（软删除，保留反馈信号）
            userAdjusted:
              type: boolean
              description: 是否被用户手动调整过，作为算法反馈信号
            updatedAt:
              type: string
              format: date-time
              description: 更新时间
    PlanTaskUpdate:
      type: object
      description: 调整任务请求体，至少传一项
      minProperties: 1
      properties:
        estimatedMinutes:
          type: integer
          description: 用户手动改时长
        status:
          $ref: '#/components/schemas/TaskStatus'
        removed:
          type: boolean
          description: true 表示删除该任务（软删除，保留反馈信号）
    PlanAdaptation:
      type: object
      description: 本次计划基于哪次状态评估做了强度调整；新用户无历史数据时整体为 null
      required: [assessmentId, stateLabel, adjustment, note]
      properties:
        assessmentId:
          type: string
          description: 依据的状态评估 ID
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        adjustment:
          type: string
          description: 调整方向，如 reduce_load
        note:
          type: string
          description: 面向用户的调整说明
    Plan:
      type: object
      description: 学习计划
      required: [planId, planDate, availableMinutes, tasks, createdAt]
      properties:
        planId:
          type: string
          description: 计划 ID
        planDate:
          type: string
          format: date
          description: 计划归属日期
        availableMinutes:
          type: integer
          description: 本次可用学习时间（分钟）
        adaptedFrom:
          allOf:
            - $ref: '#/components/schemas/PlanAdaptation'
          nullable: true
          description: 新用户无历史数据时为 null
        tasks:
          type: array
          description: 任务列表
          items:
            $ref: '#/components/schemas/PlanTask'
        createdAt:
          type: string
          format: date-time
          description: 生成时间
        weaknessHints:
          type: array
          description: 板块二短板提示（v2.3 增量）；新用户无 mastery 数据时为空数组
          items:
            $ref: '#/components/schemas/PlanWeaknessHint'
          default: []
    PlanCreate:
      type: object
      description: 生成计划请求体
      required: [planDate, availableMinutes]
      properties:
        planDate:
          type: string
          format: date
          description: 计划归属日期
        availableMinutes:
          type: integer
          minimum: 10
          maximum: 600
          description: 本次可用学习时间，10-600 分钟
        goalIds:
          type: array
          description: 可选，关联目标；不传则使用全部 active 目标
          items:
            type: string
        regenerate:
          type: boolean
          default: false
          description: 可选，默认 false；true 覆盖当日已有计划
    PlanList:
      type: object
      description: 计划列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ---------- 学习记录 ----------
    RecordBehavior:
      type: object
      description: 行为数据（系统自动记录为主）
      required: [completion]
      properties:
        completion:
          $ref: '#/components/schemas/Completion'
        accuracy:
          type: number
          minimum: 0
          maximum: 1
          description: 可选，正确率 0-1；无客观测验时不传，服务端将该项权重归零重分配
        interruptions:
          type: integer
          default: 0
          description: 可选，中断次数，默认 0
        blurCount:
          type: integer
          description: 可选，页面失焦次数（小程序弱信号），客户端自动采集
    RecordSelfReport:
      type: object
      description: 自评数据，控制在 10 秒内完成
      required: [focus, fatigue, emotion, difficultyFeel]
      properties:
        focus:
          type: integer
          minimum: 1
          maximum: 5
          description: 专注度 1-5
        fatigue:
          type: integer
          minimum: 1
          maximum: 5
          description: 疲劳度 1-5
        emotion:
          $ref: '#/components/schemas/Emotion'
        difficultyFeel:
          $ref: '#/components/schemas/DifficultyFeel'
    RecordInput:
      type: object
      description: 提交学习记录请求体
      required: [subject, startedAt, durationMinutes, behavior, selfReport]
      properties:
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          description: 状态按学科分开评估，故必填
        startedAt:
          type: string
          format: date-time
          description: 学习开始时间
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 600
          description: 实际学习时长，1-600
        planTaskId:
          type: string
          description: 可选，关联计划任务；自由学习可不传
        behavior:
          $ref: '#/components/schemas/RecordBehavior'
        selfReport:
          $ref: '#/components/schemas/RecordSelfReport'
        note:
          type: string
          maxLength: 100
          description: 可选，≤100 字备注，出域受 sendTextToAI 控制
        skipRecommendation:
          type: boolean
          default: false
          description: 可选，默认 false；true 时不自动生成建议
    LearningRecord:
      type: object
      description: 已保存的学习记录
      required: [recordId, subject, startedAt, durationMinutes, behavior, selfReport, createdAt]
      properties:
        recordId:
          type: string
          description: 记录 ID
        subject:
          $ref: '#/components/schemas/Subject'
        startedAt:
          type: string
          format: date-time
          description: 学习开始时间
        durationMinutes:
          type: integer
          description: 实际学习时长
        planTaskId:
          type: string
          nullable: true
          description: 关联的计划任务；自由学习为 null
        behavior:
          $ref: '#/components/schemas/RecordBehavior'
        selfReport:
          $ref: '#/components/schemas/RecordSelfReport'
        note:
          type: string
          maxLength: 100
          nullable: true
          description: |
            用户备注，回读 RecordInput.note；未填写时为 null。
            此前 RecordInput 有 note 入参但 LearningRecord 出参缺失，用户无法找回自己写过的内容，已补齐。
        createdAt:
          type: string
          format: date-time
          description: 提交时间
    AssessmentSnapshot:
      type: object
      description: |
        提交/删除记录后同步重算得到的状态快照。
        数据不足（dataSufficient=false）时 assessmentId 为 null，且不输出 windowScore / trend ——
        与 StateResult（GET /assessments/current）的语义完全一致，两处对同一状态只有一种表示。
        此前本 schema 将三个字段定义为必填且不可空，与 StateResult 及 PRD 5.2「数据不足时不强行输出结论」矛盾，
        已对齐修复；放宽必填性不破坏已按旧契约实现的调用方。
      required: [subject, stateLabel, dataSufficient, recordCount]
      properties:
        assessmentId:
          type: string
          nullable: true
          description: 状态评估 ID；数据不足时为 null
        subject:
          $ref: '#/components/schemas/Subject'
        windowScore:
          type: number
          minimum: 0
          maximum: 1
          description: 滑动窗口状态分（0-1）；数据不足时不返回
        trend:
          $ref: '#/components/schemas/Trend'
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        dataSufficient:
          type: boolean
          description: 数据是否充足；false 时不下结论
        recordCount:
          type: integer
          description: 窗口内记录数
    LearningRecordCreated:
      allOf:
        - $ref: '#/components/schemas/LearningRecord'
        - type: object
          description: 提交成功后附带的状态快照与建议句柄
          required: [assessment]
          properties:
            assessment:
              $ref: '#/components/schemas/AssessmentSnapshot'
            recommendation:
              type: object
              nullable: true
              description: 自动创建的建议生成任务；skipRecommendation=true 时为 null
              required: [recommendationId, status]
              properties:
                recommendationId:
                  type: string
                  description: 建议 ID，用于轮询 GET /recommendations/{id}
                status:
                  type: string
                  description: 生成状态；此句柄只出现在刚创建时，取值恒为 pending
                  enum: [pending]
    LearningRecordList:
      type: object
      description: 学习记录列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LearningRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'
    LearningRecordDeleted:
      type: object
      description: 删除记录后的响应，含重算后的状态
      required: [deleted, recordId, recalculatedAssessment]
      properties:
        deleted:
          type: boolean
          description: 是否删除成功
        recordId:
          type: string
          description: 被删除的记录 ID
        recalculatedAssessment:
          $ref: '#/components/schemas/AssessmentSnapshot'

    # ---------- 状态评估 ----------
    StateBasedOn:
      type: object
      description: 可解释性依据（PRD 8.3），不暴露权重与公式
      required: [recordIds, signals]
      properties:
        recordIds:
          type: array
          description: 参与计算的记录 ID
          items:
            type: string
        signals:
          type: array
          description: 面向用户的信号说明
          items:
            type: string
    StateResult:
      type: object
      description: 单学科当前状态结果；数据不足时 assessmentId 为 null 且不输出 windowScore / trend
      required: [subject, stateLabel, displayText, dataSufficient, recordCount, windowSize]
      properties:
        assessmentId:
          type: string
          nullable: true
          description: 状态评估 ID；数据不足时为 null
        subject:
          $ref: '#/components/schemas/Subject'
        windowScore:
          type: number
          minimum: 0
          maximum: 1
          description: 滑动窗口状态分（0-1），数据不足时不返回
        trend:
          $ref: '#/components/schemas/Trend'
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        displayText:
          type: string
          description: 面向用户的自然语言说明
        dataSufficient:
          type: boolean
          description: 数据是否充足
        recordCount:
          type: integer
          description: 窗口内记录数
        windowSize:
          type: integer
          description: 滑动窗口长度
        basedOn:
          $ref: '#/components/schemas/StateBasedOn'
        computedAt:
          type: string
          format: date-time
          description: 计算时间
    StateResultList:
      type: object
      description: 当前状态响应；不传 subject 时返回全部学科（不做跨学科加权综合）
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StateResult'
    AssessmentHistoryPoint:
      type: object
      description: 趋势曲线上的单个数据点
      required: [date, windowScore, stateLabel, trend]
      properties:
        date:
          type: string
          format: date
          description: 日期
        windowScore:
          type: number
          minimum: 0
          maximum: 1
          description: 当日窗口状态分（0-1）
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        trend:
          $ref: '#/components/schemas/Trend'
    AssessmentHistory:
      type: object
      description: 状态历史响应
      required: [subject, items]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentHistoryPoint'
    AssessmentFeedback:
      type: object
      description: 「这个判断准不准」反馈请求体
      required: [accurate]
      properties:
        accurate:
          type: boolean
          description: 判断是否准确

    # ---------- 个性化建议 ----------
    RecommendationItem:
      type: object
      description: 单条建议
      required: [title, content]
      properties:
        title:
          type: string
          description: 建议标题
        content:
          type: string
          description: 建议正文，口语化且贴合本次学习情况
    RecommendationBasedOn:
      type: object
      description: 建议的生成依据（PRD 6.5 留痕）
      required: [stateLabel, explain]
      properties:
        assessmentId:
          type: string
          description: 依据的状态评估 ID
        recordId:
          type: string
          description: 依据的学习记录 ID
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        explain:
          type: string
          description: 面向用户的依据说明
    Recommendation:
      type: object
      description: 建议详情；生成中时 items 为 null，兜底时 generation.source 为 template 但结构一致
      required: [recommendationId, scene, generation]
      properties:
        recommendationId:
          type: string
          description: 建议 ID
        scene:
          $ref: '#/components/schemas/RecScene'
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          nullable: true
          description: 关联学科
        generation:
          $ref: '#/components/schemas/GenerationStatus'
        items:
          type: array
          nullable: true
          description: 建议内容；生成中为 null
          items:
            $ref: '#/components/schemas/RecommendationItem'
        basedOn:
          $ref: '#/components/schemas/RecommendationBasedOn'
        feedback:
          allOf:
            - $ref: '#/components/schemas/FeedbackRecord'
          nullable: true
          description: 用户反馈；未反馈时为 null
    RecommendationPending:
      type: object
      description: 手动请求建议后的受理响应
      required: [recommendationId, scene, generation, createdAt]
      properties:
        recommendationId:
          type: string
          description: 建议 ID，用于轮询
        scene:
          $ref: '#/components/schemas/RecScene'
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          nullable: true
          description: 关联学科
        generation:
          $ref: '#/components/schemas/GenerationStatus'
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    RecommendationCreate:
      type: object
      description: 手动请求生成建议请求体
      required: [scene]
      properties:
        scene:
          $ref: '#/components/schemas/RecScene'
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          description: 可选，post_session 场景建议必填
        recordId:
          type: string
          description: 可选，post_session 场景关联的学习记录
    RecommendationList:
      type: object
      description: 建议列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        pagination:
          $ref: '#/components/schemas/Pagination'
    RecommendationFeedbackResult:
      type: object
      description: 建议反馈提交结果
      required: [recommendationId, feedback]
      properties:
        recommendationId:
          type: string
          description: 建议 ID
        feedback:
          $ref: '#/components/schemas/FeedbackRecord'

    # ---------- 学习总结与复盘 ----------
    SummaryContent:
      type: object
      description: 复盘固定输出框架（PRD 5.4），数据不足时整体为 null
      required: [overview, patterns, suggestions, encouragement]
      properties:
        overview:
          type: string
          description: 这段时间的状态概览
        patterns:
          type: array
          description: 观察到的规律
          items:
            type: string
        suggestions:
          type: array
          description: 下阶段建议，可直接落到计划调整
          items:
            type: string
        encouragement:
          type: string
          description: 一句鼓励性收尾
    SummaryDataPoints:
      type: object
      description: 复盘引用的数据点；数据不足时返回 recordCount 与 minRequired
      properties:
        recordCount:
          type: integer
          description: 区间内记录数
        subjects:
          type: array
          description: 覆盖的学科
          items:
            $ref: '#/components/schemas/Subject'
        planCompletionRatio:
          type: number
          description: 计划完成比例
        referencedAssessmentIds:
          type: array
          description: 引用的状态评估 ID
          items:
            type: string
        minRequired:
          type: integer
          description: 生成复盘所需的最小记录数，数据不足时出现
    Summary:
      type: object
      description: 复盘详情
      required: [summaryId, generation]
      properties:
        summaryId:
          type: string
          description: 复盘 ID
        dimension:
          type: string
          description: 复盘维度（板块二知识复盘 = knowledge；板块一状态与规划 = state_and_plan）
          enum: [state_and_plan, knowledge]
          default: state_and_plan
        periodStart:
          type: string
          format: date
          description: 起始日期
        periodEnd:
          type: string
          format: date
          description: 结束日期
        generation:
          $ref: '#/components/schemas/GenerationStatus'
        content:
          allOf:
            - $ref: '#/components/schemas/SummaryContent'
          nullable: true
          description: 数据不足或生成失败时为 null
        dataPoints:
          $ref: '#/components/schemas/SummaryDataPoints'
        message:
          type: string
          description: 数据不足时的提示文案
        feedback:
          allOf:
            - $ref: '#/components/schemas/FeedbackRecord'
          nullable: true
          description: 用户反馈；未反馈时为 null
    SummaryPending:
      type: object
      description: 手动触发复盘后的受理响应
      required: [summaryId, periodStart, periodEnd, generation, createdAt]
      properties:
        summaryId:
          type: string
          description: 复盘 ID，用于轮询
        periodStart:
          type: string
          format: date
          description: 起始日期
        periodEnd:
          type: string
          format: date
          description: 结束日期
        generation:
          $ref: '#/components/schemas/GenerationStatus'
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    SummaryCreate:
      type: object
      description: 手动触发复盘请求体
      required: [periodStart, periodEnd]
      properties:
        periodStart:
          type: string
          format: date
          description: 起始日期
        periodEnd:
          type: string
          format: date
          description: 结束日期，区间长度 3-31 天
    SummaryList:
      type: object
      description: 复盘列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Summary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SummaryFeedbackResult:
      type: object
      description: 复盘反馈提交结果
      required: [summaryId, feedback]
      properties:
        summaryId:
          type: string
          description: 复盘 ID
        feedback:
          $ref: '#/components/schemas/FeedbackRecord'

    # ==================== 板块二：学科知识库（PRD 12.3.1） ====================
    KnowledgeSubject:
      type: object
      description: 已启用学科（kb_subjects）
      required: [subjectCode, name, pointCount, version]
      properties:
        subjectCode:
          type: string
          description: 学科代码（SX/WL/YY）
        name:
          type: string
          description: 学科显示名
        gradeBand:
          type: string
          description: 学段（junior/senior/other）
        pointCount:
          type: integer
          description: 已启用知识点数
        version:
          type: string
          description: 内容数据版本号
    KnowledgeSubjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSubject'
    KnowledgePoint:
      type: object
      description: 学科知识点（kb_points）
      required: [pointId, subjectCode, code, name, definition, difficulty, examWeight]
      properties:
        pointId:
          type: string
          description: 知识点 ID（kp_ 前缀）
        subjectCode:
          type: string
        code:
          type: string
          description: 知识点唯一代码，如 SX.func.monotonicity
        name:
          type: string
        definition:
          type: string
          description: 概念定义
        parentId:
          type: string
          nullable: true
          description: 父知识点 ID；构图谱树
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          description: 难度 1-5
        examWeight:
          type: number
          description: 考试权重（学科聚合掌握度占比用），0-1 的小数
        errorTip:
          type: string
          description: 易错点提示
    KnowledgePointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePoint'
    KnowledgePointRelationType:
      type: string
      description: 概念关系四类（PRD 12.3.3）
      enum: [prerequisite, derived, contrast, applied_in]
    KnowledgePointRelation:
      type: object
      required: [srcPointId, dstPointId, type]
      properties:
        srcPointId:
          type: string
        dstPointId:
          type: string
        type:
          $ref: '#/components/schemas/KnowledgePointRelationType'
        weight:
          type: number
          description: 关系权重 0-1
    KnowledgePointDetail:
      type: object
      required: [pointId]
      properties:
        pointId:
          type: string
        subjectCode:
          type: string
        code:
          type: string
        name:
          type: string
        definition:
          type: string
        parentId:
          type: string
          nullable: true
        difficulty:
          type: integer
        examWeight:
          type: number
        errorTip:
          type: string
          description: 易错点提示
        explanation:
          type: string
          nullable: true
          description: 讲解（80-200 字）
        frequency:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 考频 1-5
        typicalErrors:
          type: array
          nullable: true
          items:
            type: string
          description: 典型错误（至少 3 条具体犯错动作）
        example:
          type: string
          nullable: true
          description: 例题，以「[仿题]」开头，含题目+解析
        keywords:
          type: array
          nullable: true
          items:
            type: string
          description: 关键词 3-8 个
        modulePath:
          type: string
          nullable: true
          description: 模块路径
        sourceVersion:
          type: string
          nullable: true
          description: 教材版本全称（如"人教A版2019"）
        relations:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePointRelation'
    KnowledgeGraph:
      type: object
      description: 学科概念图谱（v2.1 树形占位；v2.3 全量力导向）；weakPointIds 为 v2.3 薄弱路径高亮增量
      required: [subjectCode, nodes, edges]
      properties:
        subjectCode:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePoint'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePointRelation'
        weakPointIds:
          type: array
          description: 当前用户该学科下 mastery<0.4 且样本充足的知识点 id；无数据时为空数组
          items:
            type: string
          default: []
    PlanWeaknessHint:
      type: object
      description: 学习计划短板提示（v2.3）；按 mastery 升序，仅含样本充足的点
      required: [pointId, pointName, mastery]
      properties:
        pointId:
          type: string
        pointName:
          type: string
        mastery:
          type: number
          format: float
          description: 0-1
        subjectCode:
          type: string

    KnowledgePointMatch:
      type: object
      required: [pointId, name, confidence, matchedBy]
      properties:
        pointId:
          type: string
        name:
          type: string
        subjectCode:
          type: string
        confidence:
          type: number
          description: 匹配置信度 0-1
        matchedBy:
          type: string
          description: 匹配方式（embedding / keyword_fallback）
          enum: [embedding, keyword_fallback]
    KnowledgePointMatchList:
      type: object
      required: [items, matchedBy]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePointMatch'
        matchedBy:
          type: string
          enum: [embedding, keyword_fallback]

    # ==================== 板块二：错题本（PRD 12.3.2） ====================
    # ---------- 题本升格：错因 + 意图两个正交维度（D48） ----------
    ErrorCause:
      type: string
      description: >-
        结构化错因（错题专有，D48）。与 errorType（自由文本，历史兼容）并存：
        errorCause 用于统计与 mastery 归因，errorType 保留自述原文。
        取值对应目标态 §4.4.1 的错因分类；careless 与既有自由文本口径里的 "careless" 对齐。
      enum: [concept_unclear, calculation_error, misreading, careless, knowledge_gap, other]
    ErrorIntent:
      type: string
      description: >-
        用户主观意图（D48）。review=想复习 / good=好题 / typical=典型 / doubtful=存疑。
        错题 = 有错因标记；star 题 = 只有意图标记、无错因；两者都进艾宾浩斯复习队列，
        但 mastery 与归因只消费「有错因」的。
      enum: [review, good, typical, doubtful]
    ErrorRecordCreate:
      type: object
      required: [subject, rawText]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        rawText:
          type: string
          maxLength: 4000
          description: 错题原文（仅本地，永不出域）
        studentAnswer:
          type: string
          maxLength: 4000
          description: 学生作答
        correctAnswer:
          type: string
          maxLength: 4000
          description: 正确答案
        errorType:
          type: string
          description: 错因分类，如 concept/calculation/careless
        errorNote:
          type: string
          maxLength: 4000
          description: 自述错因
        pointIds:
          type: array
          description: 用户确认关联的知识点 ID
          items:
            type: string
        errorCause:
          $ref: '#/components/schemas/ErrorCause'
        intent:
          $ref: '#/components/schemas/ErrorIntent'
        sourceExamId:
          type: string
          description: 来源考试 ID（D49；错题可标记来自某次考试）
    ErrorRecordUpdate:
      type: object
      description: 错题局部更新，至少传一项
      minProperties: 1
      properties:
        errorType:
          type: string
        errorNote:
          type: string
          maxLength: 4000
        status:
          type: string
          enum: [open, resolved]
        pointIds:
          type: array
          items:
            type: string
        errorCause:
          $ref: '#/components/schemas/ErrorCause'
        intent:
          $ref: '#/components/schemas/ErrorIntent'
        sourceExamId:
          type: string
          nullable: true
          description: 来源考试 ID；传 null 表示清除关联
    LinkedPoint:
      type: object
      required: [pointId, confidence]
      properties:
        pointId:
          type: string
        name:
          type: string
        confidence:
          type: number
    ErrorRecord:
      type: object
      required: [errorId, subject, rawText, status, createdAt]
      properties:
        errorId:
          type: string
        subject:
          $ref: '#/components/schemas/Subject'
        rawText:
          type: string
          maxLength: 4000
        studentAnswer:
          type: string
          nullable: true
        correctAnswer:
          type: string
          nullable: true
        errorType:
          type: string
          nullable: true
        errorNote:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, resolved]
        points:
          type: array
          items:
            $ref: '#/components/schemas/LinkedPoint'
        createdAt:
          type: string
          format: date-time
        lastReviewedAt:
          type: string
          format: date-time
          nullable: true
        errorCause:
          allOf:
            - $ref: '#/components/schemas/ErrorCause'
          nullable: true
          description: 结构化错因（D48）；无错因即非「错题」（可能是只有意图的 star 题）
        intent:
          allOf:
            - $ref: '#/components/schemas/ErrorIntent'
          nullable: true
          description: 用户主观意图（D48）
        sourceExamId:
          type: string
          nullable: true
          description: 来源考试 ID（D49）
    ErrorBookList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ErrorRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ErrorRecordDeleted:
      type: object
      required: [deleted, errorId]
      properties:
        deleted:
          type: boolean
        errorId:
          type: string
    ReviewSubmit:
      type: object
      required: [recallCorrect]
      properties:
        recallCorrect:
          type: boolean
          description: 这次复习是否回忆正确
    ReviewResult:
      type: object
      required: [correct, nextReviewAt, intervalDays]
      properties:
        correct:
          type: boolean
        nextReviewAt:
          type: string
          format: date
          description: 下一次复习日期（回忆正确按 1/2/4/7/15 递进；错误回到 1 天）
        intervalDays:
          type: integer
          description: 下次复习间隔天数
    ErrorParseRequest:
      type: object
      description: 错题归因（合规形态）：引用已入库错题，原文不出域
      required: [errorId]
      properties:
        errorId:
          type: string
    ErrorParseResponse:
      type: object
      required: [parse, source, basedOn]
      properties:
        parse:
          type: string
          description: 归因分析文案
        source:
          type: string
          enum: [llm, template]
        basedOn:
          type: array
          description: 检索到的知识点片段（名称，供前端展示依据）
          items:
            type: string

    # ==================== 板块二：知识点掌握（PRD 12.3.4） ====================
    PointMasteryResult:
      type: object
      required: [pointId, dataSufficient, sampleSize]
      properties:
        pointId:
          type: string
        mastery:
          type: number
          nullable: true
          description: 0-1 掌握度；样本 <3 时为 null
        dataSufficient:
          type: boolean
          description: 样本 >=3 才为 true
        sampleSize:
          type: integer
        factors:
          type: object
          description: 五因子明细（错误率/正确率/近度/保持/未解决），样本充足时出现
          additionalProperties:
            type: number
        updatedAt:
          type: string
          format: date-time
    SubjectMasteryResult:
      type: object
      required: [subjectCode, dataSufficient, sampleSize]
      properties:
        subjectCode:
          type: string
        mastery:
          type: number
          nullable: true
        dataSufficient:
          type: boolean
        sampleSize:
          type: integer
        points:
          type: array
          description: 子知识点掌握度贡献列表
          items:
            $ref: '#/components/schemas/PointMasteryResult'
    MasteryTimelinePoint:
      type: object
      required: [date, mastery]
      properties:
        date:
          type: string
          format: date
        mastery:
          type: number
          nullable: true
        sampleSize:
          type: integer
    MasteryTimeline:
      type: object
      required: [subjectCode, items]
      properties:
        subjectCode:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MasteryTimelinePoint'

    # ==================== 板块二：知识复盘（PRD 12.3.5） ====================
    KnowledgeSummaryCreate:
      type: object
      required: [periodStart, periodEnd, subject]
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
          description: 区间长度 3-31 天
        subject:
          $ref: '#/components/schemas/Subject'

    # ==================== 契约漂移补录 schema ====================
    DailySummary:
      type: object
      required: [date, summary]
      properties:
        date:
          type: string
          format: date
        summary:
          type: string
          description: 一句话总结（≤60 字）
    WeightSnapshot:
      type: object
      required: [alpha, beta, w1, w2, w3, w4, w5, w6]
      properties:
        alpha: { type: number }
        beta: { type: number }
        w1: { type: number }
        w2: { type: number }
        w3: { type: number }
        w4: { type: number }
        w5: { type: number }
        w6: { type: number }
    WeightAdjustLogItem:
      type: object
      required: [id, before, after, reason, reverted, effectiveAt]
      properties:
        id: { type: string }
        before:
          $ref: '#/components/schemas/WeightSnapshot'
        after:
          $ref: '#/components/schemas/WeightSnapshot'
        reason: { type: string }
        reverted: { type: boolean }
        revertReason: { type: string, nullable: true }
        effectiveAt:
          type: string
          format: date-time
    WeightConfig:
      type: object
      required: [current, updatedAt, recentLogs]
      properties:
        current:
          $ref: '#/components/schemas/WeightSnapshot'
        updatedAt:
          type: string
          format: date-time
        recentLogs:
          type: array
          items:
            $ref: '#/components/schemas/WeightAdjustLogItem'
    TuneNowResult:
      type: object
      required: [tuned, message]
      properties:
        tuned: { type: boolean }
        message: { type: string }
    StateBreakdown:
      type: object
      required:
        - subject
        - windowScore
        - behaviorSubAvg
        - selfReportSubAvg
        - recordCount
        - windowSize
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        windowScore:
          type: number
          nullable: true
        behaviorSubAvg: { type: number }
        selfReportSubAvg: { type: number }
        behaviorContribution: { type: number }
        selfReportContribution: { type: number }
        behaviorShare: { type: number }
        selfReportShare: { type: number }
        recordCount: { type: integer }
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        trend:
          $ref: '#/components/schemas/Trend'
        signals:
          type: array
          items: { type: string }
        weights:
          $ref: '#/components/schemas/WeightSnapshot'
        windowSize: { type: integer }
    RecommendationContent:
      type: object
      required: [eligible, recordCount, recentWindowDays, reason, fromLLM]
      properties:
        eligible: { type: boolean }
        recordCount: { type: integer }
        recentWindowDays: { type: integer }
        subject:
          $ref: '#/components/schemas/Subject'
        topic: { type: string, nullable: true }
        reason: { type: string }
        fromLLM: { type: boolean }

    # ---------- 板块三：群体匿名参照（M1 契约转正） ----------
    CommunityStage:
      type: string
      description: 学段（初中 / 高中）
      enum: [junior, senior]
    CommunityMetric:
      type: string
      description: 聚合指标（hours 小时/周、focus/fatigue 1-5 整数、completion 0-1 比例）
      enum: [hours, focus, fatigue, completion]
    CommunityConsent:
      type: object
      description: 匿名聚合授权状态
      required: [enabled, autoParticipate, updatedAt]
      properties:
        enabled:
          type: boolean
          description: 是否已授权参与匿名群体聚合（默认 false）
        autoParticipate:
          type: boolean
          description: 「每周自动参与」选项（§4.7 决议）：一次性开启后免逐周确认
        updatedAt:
          type: string
          format: date-time
          description: 最近变更时间
    CommunityConsentUpdate:
      type: object
      description: 授权状态更新请求体
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: true=显式开启（自动参与）；false=撤回（物理删除历史特征并退出聚合池）
        autoParticipate:
          type: boolean
          description: 是否自动参与每周聚合（enabled=true 时生效，默认 true）
    CommunityHistogramBucket:
      type: object
      description: 直方图桶（count≥3 时才单独下发，小计数桶已并入相邻桶）
      required: [lo, hi, count]
      properties:
        lo:
          type: number
          description: 桶下界
        hi:
          type: number
          nullable: true
          description: 桶上界；顶桶为 open 区间时 null（前端用「32h+」式开放标签）
        count:
          type: integer
          description: 桶内人数（≥3）
    CommunityPercentiles:
      type: object
      description: 群体分位数（真值下发，不对齐桶边界）
      required: [p25, p50, p75]
      properties:
        p25: { type: number }
        p50: { type: number }
        p75: { type: number }
    CommunityAggregate:
      type: object
      description: 群体聚合结果（仅 k≥20 时返回 poolSize）
      required: [stage, metric, period, poolSize, percentiles, histogram, computedAt]
      properties:
        stage:
          $ref: '#/components/schemas/CommunityStage'
        metric:
          $ref: '#/components/schemas/CommunityMetric'
        period:
          type: string
          description: 当前 ISO 周（如 2026-W35）
        poolSize:
          type: integer
          description: 本聚合池人数（≥20）
        percentiles:
          $ref: '#/components/schemas/CommunityPercentiles'
        histogram:
          type: array
          description: 直方图桶（已做 count<3 合并）
          items:
            $ref: '#/components/schemas/CommunityHistogramBucket'
        computedAt:
          type: string
          format: date-time
          description: 聚合计算时间

    # ========== 重构 M0 · 新增实体（X0 定 schema，接口由各板块后续补） ==========
    #
    # 本节 schema 对应 M0 新建的 13 张表 + 3 处既有表扩展。**字段名为最终口径**：
    # 各板块补接口时直接引用，不得另起字段名（契约铁律：先改本文件再写接口）。
    # DDL 由 X0 出 Alembic 迁移，单 head（见 refactor-module-contracts.md §2）。
    # 表名与 schema 的对应：exams / collections / collection_items / usage_ledger /
    # invite_codes / violation_logs / error_reports / medals / user_profiles /
    # topic_summaries / explanations / chat_sessions / chat_raw_messages。

    # ---------- C 板块：考试（D49） ----------
    Exam:
      type: object
      description: 考试。独立实体，不是 Goal 的一种；Goal 用 examId + targetScore 引用它。
      required: [examId, subject, name, examDate, fullScore, createdAt]
      properties:
        examId: { type: string }
        subject:
          $ref: '#/components/schemas/Subject'
        name:
          type: string
          description: 考试名称，如「期中考试」
        examDate:
          type: string
          format: date
        score:
          type: number
          nullable: true
          description: >-
            得分。考后回填，回填前为 null。成绩是唯一能把「自评」与「实际」对上的客观数据，
            回填后喂状态评估与画像（D49）。
        fullScore: { type: number }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: 最近更新时间（考试可编辑，见 ExamUpdate）
    ExamCreate:
      type: object
      required: [subject, name, examDate, fullScore]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        name: { type: string }
        examDate: { type: string, format: date }
        fullScore: { type: number }
        score: { type: number, nullable: true }
    ExamUpdate:
      type: object
      description: 考试局部更新，至少传一项
      minProperties: 1
      properties:
        name: { type: string }
        examDate: { type: string, format: date }
        fullScore: { type: number }
        score: { type: number, nullable: true }
    ExamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Exam'

    # ---------- E 板块：收藏体系（D46 / D47 / #41 / #52） ----------
    Collection:
      type: object
      description: 收藏的自定义分组。内置分组（学科 / 时间 / 掌握度）是筛选维度、不入表，两者正交。
      required: [collectionId, name, createdAt]
      properties:
        collectionId: { type: string }
        name:
          type: string
          description: 用户自建分组名（如「计划」「闲聊」）
        itemCount:
          type: integer
          description: 组内条目数（列表接口按需下发）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: 最近更新时间（分组可重命名，见 CollectionUpdate）
    CollectionCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
    CollectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
    CollectionSnapshot:
      type: object
      description: >-
        收藏内容的**快照**（D46 硬约束）。因为 D45 不存对话历史、原文只做短期留存，
        收藏若只存引用，原文一到期就变成死链。图片圈选的收藏必须存裁剪后的小图。
      required: [content]
      properties:
        content:
          type: string
          description: 收藏时的正文快照（原样保存，不随原文过期而失效）
        format:
          type: string
          enum: [markdown, plain]
          description: >-
            content 的文本格式。模型输出多为 Markdown，收藏时**原样保存格式**，
            前端据此决定是否渲染（不要靠猜或正则嗅探）。
          default: markdown
        imageRef:
          type: string
          nullable: true
          description: 裁剪后小图的存储引用（图片圈选场景）
    CollectionSourceRef:
      type: object
      description: 来源引用（仅用于溯源标注，不承担内容可读性）
      properties:
        type:
          type: string
          enum: [chat_message, explanation, search_answer, knowledge_point, upload_summary, manual]
        refId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        subject:
          $ref: '#/components/schemas/Subject'
    CollectionHighlight:
      type: object
      description: 划选高亮（内容不可编辑，高亮只改显示）
      properties:
        start:
          type: integer
          description: 起始偏移（**按 Unicode 码点计**，不是字节；前端划选直接取 selection 的字符偏移）
        end:
          type: integer
          description: 结束偏移（同上，左闭右开）
    CollectionBlurState:
      type: object
      description: >-
        「虚化」标记（#41 / §4.8.4）：把选中文本做模糊显示，用于隐藏信息或自测（填空题）。
        虚化不算编辑——只改显示不改内容，且状态必须持久化。
      properties:
        start:
          type: integer
          description: 起始偏移（按 Unicode 码点计，口径同 CollectionHighlight）
        end:
          type: integer
          description: 结束偏移（左闭右开）
    CollectionItem:
      type: object
      description: 收藏条目。内容不可编辑（保证留存真实性），只支持高亮与虚化标记。
      required: [itemId, snapshot, createdAt]
      properties:
        itemId: { type: string }
        collectionId:
          type: string
          nullable: true
          description: 自定义分组 ID；未分组为 null（内置维度不入表）
        title: { type: string, nullable: true }
        snapshot:
          $ref: '#/components/schemas/CollectionSnapshot'
        sourceRef:
          $ref: '#/components/schemas/CollectionSourceRef'
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/CollectionHighlight'
        blurStates:
          type: array
          description: 虚化区间；全屏展开时方向键切换焦点、空格临时解除
          items:
            $ref: '#/components/schemas/CollectionBlurState'
        createdAt:
          type: string
          format: date-time
    CollectionItemCreate:
      type: object
      description: 新增收藏。同一条内容反复收藏 → 覆盖并给轻提示（#52），不新增副本。
      required: [snapshot]
      properties:
        collectionId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        snapshot:
          $ref: '#/components/schemas/CollectionSnapshot'
        sourceRef:
          $ref: '#/components/schemas/CollectionSourceRef'
    CollectionItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
    CollectionItemUpdate:
      type: object
      description: >-
        收藏条目的标记更新。**内容不可编辑**（保证留存真实性，D46），只能改分组、标题、
        高亮与虚化标记——虚化必须可持久化（#41），否则每次展开都要重设。
      minProperties: 1
      properties:
        collectionId:
          type: string
          nullable: true
          description: 移动到自定义分组；传 null 表示移出分组
        title:
          type: string
          nullable: true
        highlights:
          type: array
          description: 高亮区间**全量覆盖**（不是增量），前端一次提交当前全部区间
          items:
            $ref: '#/components/schemas/CollectionHighlight'
        blurStates:
          type: array
          description: 虚化区间**全量覆盖**；「全部虚化」一键即提交完整列表
          items:
            $ref: '#/components/schemas/CollectionBlurState'
    CollectionUpdate:
      type: object
      description: 重命名收藏分组（自定义分组是用户标签字段，与内置筛选维度正交）
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64

    # ---------- G 板块：成本计量（#9 / D38） ----------
    UsageFeatureTier:
      type: string
      description: >-
        功能档位（分档定价依据，D38）。对应目标态 §7 的三类 AI + 上传解析：
        chat=对话式（闲聊 / 搜题 / 讲知识点 / 查；用户主动发起、有感）；
        embedded=嵌入式（建议 / 复盘 / 口语转译 / 画像提取 / 推荐卡；系统自动、无感，**不进 credits**）；
        advanced=高级（L3 富交互仿真 / 多模态搜题；稀有且贵，高级月卡或 credits 单次）；
        multimodal=文件解析（上传的图片 / PDF / PPT 理解，F 板块）。
        ⚠️ 新增档位属契约变更，需同步本枚举与定价口径。
      enum: [chat, embedded, advanced, multimodal]
    ReasoningTier:
      type: string
      description: >-
        推理等级（#33：快速 / 标准 / 深度），与 credits 扣费档位绑定。
        随手问浮窗跟随主对话档位，浮窗内不单独给选择。
      enum: [quick, standard, deep]
    UsageLedgerEntry:
      type: object
      description: >-
        按用户记录模型数值成本。**只存数值，不存任何提示词或输出内容**；
        与刻意去身份化的 AICallLog 分两套，不合并（绝不给 AICallLog 补身份字段）。
      required: [id, featureTier, model, tokensIn, tokensOut, cost, createdAt]
      properties:
        id: { type: string }
        featureTier:
          $ref: '#/components/schemas/UsageFeatureTier'
        reasoningTier:
          allOf:
            - $ref: '#/components/schemas/ReasoningTier'
          nullable: true
        model: { type: string }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        cost: { type: number, description: 数值成本（内部计价，非对用户计费） }
        createdAt:
          type: string
          format: date-time
    UsageLedgerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageLedgerEntry'
        totalCost:
          type: number
          description: 区间内数值成本合计
        totalTokensIn: { type: integer }
        totalTokensOut: { type: integer }

    # ---------- A 板块：邀请码（#50） ----------
    InviteCode:
      type: object
      description: >-
        pilot 期邀请码，一码一用、可追踪（#50）。
        ⚠️ **pilot 期不提供用户产品侧的邀请码管理接口**——生成走后台脚本，运营工具不进用户产品
        API（口径同 D42：引擎权重调参也移出用户产品）。注册时由 A 板块校验本表；
        `usedBy` / `usedAt` 供溯源，不做面向用户的展示接口。
      required: [code, createdAt]
      properties:
        code: { type: string }
        note: { type: string, nullable: true, description: 备注（发给谁 / 批次） }
        usedBy:
          type: string
          nullable: true
          description: 使用者的稳定 user_id（未使用为 null）
        usedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---------- G 板块：违规处置（#43） ----------
    ViolationAction:
      type: string
      description: 分级处置动作（1 次警告 → 3 次临时封禁 → 永久封禁），必须留痕
      enum: [warn, temp_ban, perm_ban]
    ViolationLog:
      type: object
      required: [id, level, action, reason, createdAt]
      properties:
        id: { type: string }
        level:
          type: integer
          description: 累计违规等级（1 起）
        action:
          $ref: '#/components/schemas/ViolationAction'
        reason: { type: string, description: 处置原因（命中类型，不含原文） }
        createdAt: { type: string, format: date-time }

    # ---------- G 板块：报错入口（#46） ----------
    ErrorReport:
      type: object
      description: 用户报错。两处入口：设置常驻 + 每条模型输出旁的消息级按钮；必须带上下文。
      required: [id, createdAt]
      properties:
        id: { type: string }
        messageId:
          type: string
          nullable: true
          description: 消息级报错时的消息 ID（设置常驻入口为 null）
        intent:
          type: string
          nullable: true
          description: 该条消息的意图判定结果（便于定位问题）
        description:
          type: string
          description: 用户描述的问题（回读用，与 ErrorReportCreate.description 对应）
        context:
          type: object
          nullable: true
          description: 上下文快照（消息角色 / 结构化体等，**不含对话原文流水**）
        createdAt: { type: string, format: date-time }
    ErrorReportCreate:
      type: object
      required: [description]
      properties:
        messageId: { type: string, nullable: true }
        intent: { type: string, nullable: true }
        description:
          type: string
          maxLength: 2000
          description: 用户描述的问题
        context:
          type: object
          nullable: true

    # ---------- G 板块：奖章（#49） ----------
    MedalMilestone:
      type: string
      description: pilot 只做最小版里程碑；不做积分商城 / 排行榜（与「社区不做社交」冲突）
      enum: [first_record, streak_7_days, first_summary, first_goal_achieved, first_topic_book]
    Medal:
      type: object
      required: [medalId, milestone, awardedAt]
      properties:
        medalId: { type: string }
        milestone:
          $ref: '#/components/schemas/MedalMilestone'
        awardedAt: { type: string, format: date-time }
    MedalList:
      type: object
      description: G 板块增量（2026-09-25）：本人已获得奖章列表（#49 最小版）
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Medal'
    ViolationLogList:
      type: object
      description: G 板块增量（2026-09-25）：本人违规处置留痕列表（#43）
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ViolationLog'
    AnalyticsEventCreate:
      type: object
      description: >-
        G 板块增量（2026-09-25）：埋点上报体（D39）。id / createdAt 由服务端生成；
        payload 只收结构化事件体，**不含对话原文流水**，入库前经 privacy_filter 脱敏。
      required: [category, eventType]
      properties:
        category:
          $ref: '#/components/schemas/AnalyticsCategory'
        eventType:
          type: string
          maxLength: 64
          description: >-
            事件名，如 message_sent / card_shown / card_clicked / intent_corrected /
            stack_pushed / stack_sunk / suggestion_rated / profile_extracted
        sessionId: { type: string, nullable: true }
        payload:
          type: object
          nullable: true
          description: 结构化事件体（不含对话原文流水；脱敏后入库）
        occurredAt:
          type: string
          format: date-time
          nullable: true
          description: 事件业务发生时间；缺省为服务端接收时间

    # ---------- B 板块：画像（D50） ----------
    UserProfileGroup:
      type: string
      description: >-
        画像四组（按消费方划分，注入时按意图选组、不全量注入）：
        learning=学习画像（建任务/内容建议/mastery 校准）、state=状态画像（状态建议/节奏）、
        attribution=归因画像（决定建议语气）、interest=兴趣与经历（仅闲聊语气）。
      enum: [learning, state, attribution, interest]
    UserProfileEntry:
      type: object
      description: >-
        画像条目。**可看 / 可改 / 可删，但不可手动新建**（D10/D50）——模型隐式提取写入。
        它是「不做对话历史」（D45）的信任基础设施：用户看不到往日对话，必须能检查
        模型到底记得自己什么。每条应可 trace 到提取来源。
      required: [entryId, group, key, value, updatedAt]
      properties:
        entryId: { type: string }
        group:
          $ref: '#/components/schemas/UserProfileGroup'
        key:
          type: string
          description: 条目键，如「薄弱知识点」「学习习惯」
        value: { type: string, description: 提取后的结构化值（非原始流水） }
        source:
          type: string
          nullable: true
          description: 来源（explicit=用户显式填写 / inferred=模型推断 / self_report=自评叙事轨）
        confidence:
          type: number
          nullable: true
          description: 推断置信度（显式来源为 null）
        sourceRef:
          type: string
          nullable: true
          description: >-
            提取来源引用（会话 id / 消息 id），供「这条画像是哪来的」审计追溯（§8 画像 trace）。
            ⚠️ 对话原文有 TTL（30 天），到期后该引用可能已无法还原内容——**它只是线索，不是凭据**。
        updatedAt: { type: string, format: date-time }
    UserProfileEntryUpdate:
      type: object
      description: 用户修改画像条目（只能改值与分组，不能新建）
      minProperties: 1
      properties:
        value: { type: string }
        group:
          $ref: '#/components/schemas/UserProfileGroup'
    UserProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileEntry'

    # ---------- B 板块：跨登录话题摘要（#34） ----------
    TopicSummary:
      type: object
      description: >-
        会话结束时生成的结构化摘要（2–3 条），**不存对话原文**。下次冷启动注入，
        是首页问候语「预设骨架 + 动态填充」中动态内容的唯一数据源。
      required: [summaryId, summary, createdAt]
      properties:
        summaryId: { type: string }
        sessionId:
          type: string
          nullable: true
          description: 产出该摘要的会话 id（会话老化后仍保留摘要，故可为空）
        summary:
          type: string
          description: 单条摘要，如「上次聊到函数单调性」「卡在几何辅助线」
        createdAt: { type: string, format: date-time }

    # ---------- D 板块：讲解归档（D52 / #22） ----------
    ExplanationMode:
      type: string
      description: >-
        回顾取原文（original）、重新讲现生成（regenerated）——两者并存，不用一个顶掉另一个：
        重生成保证不了一致性，而讲解的价值恰恰在「上次那个讲法、那个例子」。
      enum: [original, regenerated]
    Explanation:
      type: object
      description: 知识点讲解归档。isCurated=true 为预制入库的精品样例（pilot 做 3–5 个），长期保存，与动态生成严格区分。
      required: [explanationId, mode, content, isCurated, createdAt]
      properties:
        explanationId: { type: string }
        pointId:
          type: string
          nullable: true
          description: 知识点 ID；库外知识为 null（只进画像归因，不进 mastery）
        subject:
          $ref: '#/components/schemas/Subject'
        mode:
          $ref: '#/components/schemas/ExplanationMode'
        content: { type: string, description: 讲解正文（Markdown / 结构化分节） }
        isCurated: { type: boolean }
        createdAt: { type: string, format: date-time }

    # ---------- B 板块：会话与对话原文短期留存（D2 / D36 / D45） ----------
    ChatContextStackItem:
      type: object
      description: >-
        上下文栈的一层（D36）。栈最多挂 3 个「聊到一半」的分支，LIFO 取用（栈顶 = 最近切走的事，
        切回优先接续）。超限时最旧者按 `branchType` **沉降**（不丢，转对应持久层）：
        task_draft → 持久化中间态（进首页 Go on 组）；knowledge_help → 知识页归档（可重新发起）；
        chat → 纯闲聊直接丢弃。
      required: [branchType, enteredAt]
      properties:
        branchType:
          type: string
          description: 分支类型，同时决定超限时的沉降去向
          enum: [chat, task_draft, knowledge_help]
        intent:
          type: string
          nullable: true
          description: 进入该分支时的意图判定结果（闲聊 / 建任务 / 知识求助）
        step:
          type: string
          nullable: true
          description: 分支内进行到哪一步（如引导式搜题的步骤标识），用于「切回优先接续」
        payload:
          type: object
          nullable: true
          description: 该分支的挂起载荷（结构化；**不含对话原文流水**）
        enteredAt:
          type: string
          format: date-time
          description: 入栈时间（LIFO 与老化判定依据）
    ChatSession:
      type: object
      description: >-
        单对话模型的会话。全产品只有一条持续演进的对话——**无历史列表、无「新建对话」**。
        会话 = 一个连续使用周期，跨刷新 / 跨设备持久（服务端持久化，前端仅是视图）；
        无交互超阈值则栈内上下文老化清空（不采用每日零点重置）。
      required: [sessionId, startedAt, lastActiveAt]
      properties:
        sessionId: { type: string }
        startedAt: { type: string, format: date-time }
        lastActiveAt:
          type: string
          format: date-time
          description: >-
            最近交互时间；据此判断会话是否老化。**老化阈值定为 7 天**（§3.8.1 建议 24h–7d、默认偏长）：
            超过 7 天无交互即清空栈内上下文；沉降物不随会话老化，各走各的 TTL。
        contextStack:
          type: array
          description: 上下文栈（D36）：深度=3、LIFO、会话级，栈项结构见 ChatContextStackItem
          maxItems: 3
          items:
            $ref: '#/components/schemas/ChatContextStackItem'
    ChatRawMessage:
      type: object
      description: >-
        对话原文短期留存（D45 / §3.8.3）。**产品上不给任何回看入口**（无列表 / 无搜索 / 无导出），
        仅用于安全审计与异常排查——L3 危机响应需要事后可追溯，完全不存对未成年产品是反向风险。
        不入画像，到期物理删除（TTL 清除 job）。与「埋点存结构化事件」口径不同，不可混同。
      required: [id, role, content, createdAt, expiresAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: >-
            到期时间；TTL 清除 job 据此物理删除。**留存窗口定为 30 天**（§3.8.3 建议 7–30 天，取上限）：
            L3 危机响应要求事后可追溯，对未成年产品而言「出了事查不到用户说了什么」是反向风险，
            宁可多留几天。窗口值集中在配置里，不散落在各调用点。

    # ========== M0 补漏 · M2+ 硬需求（第二张迁移，X0 定 schema） ==========
    #
    # 原 11 张表未覆盖下列需求，各板块开工前补齐（依据见各自 description）：
    # timer_sessions / timer_segments（C·§3.6）、analytics_events（G·D39）、
    # search_archives（D·§3.8.4）、card_impressions（E·D28）。

    # ---------- C 板块：计时会话（§3.6 / D30 / D31 / #14） ----------
    TimerMode:
      type: string
      description: 计时模式。countdown=倒计时（有目标时长）；countup=正计时（不限时）
      enum: [countdown, countup]
    TimerStatus:
      type: string
      description: >-
        会话状态。running=进行中；finished=正常收尾（产生学习记录）；
        abandoned=僵尸裁决后丢弃（**不产生学习记录**）。
      enum: [running, finished, abandoned]
    TimerSession:
      type: object
      description: >-
        计时会话。**服务端持久化「进行中的会话」**（started_at + mode + target_minutes + 计划引用），
        前端只是视图——回来按**真实经过时间**恢复，根治现状「靠路由 state 传参、刷新即丢上下文」。
        只留「结束」一个出口、不做挂起（避免僵尸计时）。
      required: [sessionId, mode, startedAt, status, createdAt]
      properties:
        sessionId: { type: string }
        mode:
          $ref: '#/components/schemas/TimerMode'
        startedAt:
          type: string
          format: date-time
          description: 两种模式都有；恢复计算的基准
        targetMinutes:
          type: integer
          nullable: true
          description: 仅 countdown 有；countup 为 null
        planId: { type: string, nullable: true }
        taskId: { type: string, nullable: true }
        subject:
          $ref: '#/components/schemas/Subject'
        status:
          $ref: '#/components/schemas/TimerStatus'
        endedAt: { type: string, format: date-time, nullable: true }
        effectiveSeconds:
          type: integer
          nullable: true
          description: >-
            **有效时长**（秒），≠ 墙上时长（D31）：倒计时 = min(经过, target)；正计时异常时
            必须用户核实后才写入。不要把 endedAt − startedAt 直接当学习时长。
        lastHeartbeatAt:
          type: string
          format: date-time
          nullable: true
          description: 最近心跳；僵尸判定与「异常会话」识别的依据
        segments:
          type: array
          description: 分段（#14）：切换任务即新开一段，结束只走一次收尾
          items:
            $ref: '#/components/schemas/TimerSegment'
        createdAt: { type: string, format: date-time }
    TimerSegment:
      type: object
      description: 计时会话内的一段（#14 分段计时）。一个会话可挂多段，每段标注所属任务。
      required: [segmentId, startedAt]
      properties:
        segmentId: { type: string }
        taskId:
          type: string
          nullable: true
          description: 本段属于哪个任务；切换任务即新开一段
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        seconds:
          type: integer
          nullable: true
          description: 本段有效秒数（口径同 effectiveSeconds）
    TimerRestore:
      type: object
      description: >-
        恢复视图（D30 按 mode 分支计算）。`needsVerdict=true` 表示识别到**异常会话**，
        前端必须弹**恢复裁决卡**（D31：「上次计时似乎没正常结束（已计 X 分钟）·
        [保留按 X 记] [丢弃] [手动改时长]」），**不得自动记账**。
      required: [sessionId, mode, needsVerdict]
      properties:
        sessionId: { type: string }
        mode:
          $ref: '#/components/schemas/TimerMode'
        remainingSeconds:
          type: integer
          nullable: true
          description: 仅 countdown：剩余 = target − 已过；≤0 视为已到点（软提醒，不自动结束）
        elapsedSeconds:
          type: integer
          nullable: true
          description: 仅 countup：累计 = now − startedAt
        needsVerdict:
          type: boolean
          description: 是否需用户裁决（正计时超上限 / 倒计时到点后长时间未收尾）
        suggestedMinutes:
          type: integer
          nullable: true
          description: 裁决卡「保留按 X 记」的预填值（倒计时封顶 target；正计时按截断点）

    # ---------- G 板块：埋点事件（D39 / §8） ----------
    AnalyticsCategory:
      type: string
      description: >-
        D39 的三块埋点：chat_interaction=Chat 交互（消息/卡片/意图纠正/上下文栈/引导式搜题交互）；
        ai_quality=AI 质量反馈（读完率/采纳率/有用性/纠错）；profile_trace=画像 trace（提取与改删事件）。
      enum: [chat_interaction, ai_quality, profile_trace]
    AnalyticsEvent:
      type: object
      description: >-
        结构化埋点事件。⚠️ **与对话原文的口径不可混同**（§3.8.3 / §8 反复强调）：
        本表存的是**结构化事件**（意图判定结果、卡片事件、锚定结果、提取事件…），
        **不含对话原文流水**——原文属 `chat_raw_messages` 的短期安全留存（产品不可见、到期物理删除）。
        `payload` 入库前走 privacy_filter 脱敏。
      required: [id, category, eventType, occurredAt]
      properties:
        id: { type: string }
        category:
          $ref: '#/components/schemas/AnalyticsCategory'
        eventType:
          type: string
          description: >-
            事件名，如 message_sent / card_shown / card_clicked / intent_corrected /
            stack_pushed / stack_sunk / suggestion_rated / profile_extracted
        sessionId: { type: string, nullable: true }
        payload:
          type: object
          nullable: true
          description: 结构化事件体（**不含对话原文流水**；脱敏后入库）
        occurredAt:
          type: string
          format: date-time
          description: 事件业务发生时间（与落库时间区分）
        createdAt: { type: string, format: date-time }

    # ---------- D 板块：搜题归档（§3.8.4 / D24 / D52） ----------
    SearchMode:
      type: string
      description: >-
        解题三态（D24）：direct=直给（一次给出完整解答）/ analytic=解析式（按步骤逐项说明）/
        guided=引导式（多轮交互教学循环）。**记忆上次选择**，故必须落库。
      enum: [direct, analytic, guided]
    SearchArchive:
      type: object
      description: >-
        搜题归档（§3.8.4）。不做对话历史后，用户会重复问同一题/同一知识点，
        所以知识页归档扩为「**搜题 + 讲解**」两条链路分别留存——搜题（解一道题）与
        讲解（讲透概念）语义不同，不合并。
        题面原文属 knowledge_raw：**本地留存、永不出域**（embedding 走本地模型，PRD 12.6）。
      required: [archiveId, rawText, createdAt]
      properties:
        archiveId: { type: string }
        subject:
          $ref: '#/components/schemas/Subject'
        rawText:
          type: string
          description: 题面原文（knowledge_raw，永不出域）
        solution:
          type: string
          nullable: true
          description: 解答正文（Markdown）
        mode:
          $ref: '#/components/schemas/SearchMode'
        pointIds:
          type: array
          description: 结尾统一输出的知识点卡片（D24：三态都输出知识点卡）
          items:
            type: string
        createdAt: { type: string, format: date-time }

    # ---------- E 板块：推荐卡展示记录（D21 / D28） ----------
    CardGroup:
      type: string
      description: 首页推荐卡三组（D21）：go_on=继续 / recommend=推荐 / insight=洞察
      enum: [go_on, recommend, insight]
    CardAction:
      type: string
      description: shown=展示 / clicked=点击 / dismissed=划掉（划掉后 3 天不推）
      enum: [shown, clicked, dismissed]
    CardImpression:
      type: object
      description: >-
        卡片展示 / 点击 / 划掉事件。**D28 的冷却与去重规则直接依赖本表**——
        没有「已展示过什么」的记录，3 天 / 7 天 / 每周 1 的冷却就无从判断。
        与 `recommendations`（AI 生成的建议）不是一回事，故单独记录。
      required: [id, group, cardType, fingerprint, action, shownAt]
      properties:
        id: { type: string }
        group:
          $ref: '#/components/schemas/CardGroup'
        cardType:
          type: string
          description: >-
            卡面类型（D22 卡片协议）：continue_plan / state_advice / content_advice /
            goal_planning / group_insight
        fingerprint:
          type: string
          description: >-
            去重指纹。Go on 用 planId/recordId；推荐用 type+pointId/subject；洞察用 维度+周期。
            同指纹在冷却期内不重复出现。
        action:
          $ref: '#/components/schemas/CardAction'
        shownAt:
          type: string
          format: date-time
