          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== 板块二：错题归因（合规改造，原文不出域） ====================
  /error-parse:
    post:
      tags: [错题本]
      operationId: parseErrorRecord
      summary: 错题归因分析（RAG 合规形态：LLM 只看检索片段与错因候选，不看原文）
      description: |
        替代旧版「原文直发云端」的违规形态。入参引用已入库错题（errorId），
        后端本地检索相关知识点片段 + 生成错因候选枚举，出域内容仅为 knowledge_aggregated
        白名单字段（知识点名称/定义/易错点 + 结构化错因候选），由 EgressGuard 强校验。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorParseRequest'
      responses:
        '200':
          description: 归因分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorParseResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==================== 契约漂移补录（板块一在用接口，此前未入契约） ====================
  /daily-summary:
    get:
      tags: [学习总结与复盘]
      operationId: getDailySummary
      summary: 单日一句话学习总结
      parameters:
        - name: date
          in: query
          required: true
          description: 日期 YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 日总结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/weight-config:
    get:
      tags: [用户与设置]
      operationId: getWeightConfig
      summary: 读取当前权重 + 最近调权日志
      responses:
        '200':
          description: 权重配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightConfig'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/weight-config/tune-now:
    post:
      tags: [用户与设置]
      operationId: tuneWeightsNow
      summary: 手动触发一次调权（演示用）
      responses:
        '200':
          description: 调权结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuneNowResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/state-breakdown:
    get:
      tags: [用户与设置]
      operationId: getStateBreakdown
      summary: 按当前权重计算的窗口分 + 子分贡献分解
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Subject'
      responses:
        '200':
          description: 状态分解
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateBreakdown'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recommendation-content:
    get:
      tags: [个性化建议]
      operationId: getRecommendationContent
      summary: 导学计划页学习内容推荐（LLM 驱动）
      responses:
        '200':
          description: 推荐内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: |
        HttpOnly Session Cookie（名为 sid），登录成功后由服务端 Set-Cookie 下发，
        有效期 7 天（见 mock-server SESSION_TTL_MS）。浏览器自动携带，前端无需手动设置。
        鉴权失效时业务接口返回 401 UNAUTHENTICATED。
        （历史说明：早期契约曾假设上游 Bearer token 且不含登录/注册接口，
        实际项目改为自带 /auth/* 会话体系，本契约已据此收录，见「鉴权会话」标签。）

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，默认 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数，默认 20，上限 50
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选幂等键，24 小时内重复键直接返回首次结果（用于弱网下重复提交学习记录）
      schema:
        type: string
    GoalId:
      name: goalId
      in: path
      required: true
      description: 目标 ID
      schema:
        type: string
    PlanId:
      name: planId
      in: path
      required: true
      description: 计划 ID
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      description: 计划内任务 ID
      schema:
        type: string
    RecordId:
      name: recordId
      in: path
      required: true
      description: 学习记录 ID
      schema:
        type: string
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      description: 状态评估 ID
      schema:
        type: string
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      description: 建议 ID
      schema:
        type: string
    SummaryId:
      name: summaryId
      in: path
      required: true
      description: 复盘 ID
      schema:
        type: string

  responses:
    ValidationFailed:
      description: 参数缺失或取值越界
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: 自评专注度必须为 1-5 的整数
              field: selfReport.focus
    Unauthenticated:
      description: token 缺失或过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: 登录状态已失效，请重新登录
    GuardianAuthorizationExpired:
      description: 监护人授权失效，账号只读（PRD 8.1），仅 GET 可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GUARDIAN_AUTHORIZATION_EXPIRED
              message: 监护人授权已过期，请重新确认后继续使用
    NotFound:
      description: 资源不存在或不属于当前用户
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: 资源不存在
    RateLimited:
      description: 手动触发 AI 生成超频（PRD 6.4 控成本）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: 今日手动生成次数已达上限，请明天再试
    InternalServerError:
      description: 服务端错误。对齐 api-design-unified.md 0.2 节错误码表中的 500 INTERNAL_ERROR。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: 服务开小差了，请稍后再试
    EmailNotRegistered:
      description: 邮箱尚未注册（登录 / 找回密码 / 发码时）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: EMAIL_NOT_REGISTERED
              message: 该邮箱尚未注册，请先注册
              field: email
    KbTextTooLong:
      description: 错题原文超过 4000 字上限（PRD 12.3.2）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: KB_TEXT_TOO_LONG
              message: 错题文本过长，请精简到 4000 字以内
              field: rawText
    KbEmbeddingFailed:
      description: 本地 embedding 不可用，录入可降级为手动选知识点
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: KB_EMBEDDING_FAILED
              message: 知识点匹配服务暂不可用，请手动选择知识点
    KbInsufficientMasteryData:
      description: 掌握度样本不足（<3），不下数值结论
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: KB_INSUFFICIENT_MASTERY_DATA
              message: 该知识点样本不足，继续积累后会生成掌握度

  schemas:
    # ---------- 枚举字典（PRD 0.4） ----------
    Subject:
      type: string
      description: 学科枚举
      enum: [chinese, math, english, physics, chemistry, biology, history, geography, politics, other]
    Stage:
      type: string
      description: 学段：junior=初中，senior=高中
      enum: [junior, senior]
    GoalType:
      type: string
      description: 目标类型
      enum: [short_term, long_term]
    TaskStatus:
      type: string
      description: 任务状态
      enum: [pending, completed, partial, abandoned]
    Completion:
      type: string
      description: 任务完成度（无 pending）
      enum: [completed, partial, abandoned]
    Emotion:
      type: string
      description: 情绪状态
      enum: [positive, neutral, negative]
    DifficultyFeel:
      type: string
      description: 难度主观感受
      enum: [easy, moderate, hard]
    Trend:
      type: string
      description: 状态变化趋势
      enum: [up, flat, down]
    StateLabel:
      type: string
      description: 状态标签；insufficient_data 表示数据不足不下结论
      enum: [efficient_stable, fatigue_warning, emotion_blocked, fluctuating_up, insufficient_data]
    RecScene:
      type: string
      description: 建议场景：post_session=单次学习后，weekly_review=阶段回顾
      enum: [post_session, weekly_review]
    GenerationSource:
      type: string
      description: 生成来源：llm=模型生成，template=模板兜底
      enum: [llm, template]
    Rating:
      type: string
      description: 有用性评级
      enum: [useful, neutral, not_useful]

    # ---------- 鉴权会话（对齐 mock-server/server.js 与 authApi.js） ----------
    OkResponse:
      type: object
      description: auth 类接口的通用成功响应
      required: [ok]
      properties:
        ok:
          type: boolean
          description: 恒为 true
    EmailOnlyRequest:
      type: object
      description: 仅需邮箱的请求（发送各类验证码）
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
    RegisterRequest:
      type: object
      description: 注册请求
      required: [email, code, password, confirmPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
          description: 6 位数字验证码
        password:
          type: string
          minLength: 6
          maxLength: 32
          description: 6-32 位，需含大写/小写/数字/符号中至少两类
        confirmPassword:
          type: string
          description: 需与 password 一致
    LoginByCodeRequest:
      type: object
      description: 邮箱验证码登录 / 校验重置码请求
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
    LoginByPasswordRequest:
      type: object
      description: 邮箱密码登录请求
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ResetPasswordRequest:
      type: object
      description: 重置密码请求（找回密码第二步）
      required: [email, code, newPassword, confirmPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
        newPassword:
          type: string
          minLength: 6
          maxLength: 32
        confirmPassword:
          type: string
    AuthMeResponse:
      type: object
      description: GET /auth/me 的响应
      required: [ok, user]
      properties:
        ok:
          type: boolean
        user:
          type: object
          required: [email]
          properties:
            email:
              type: string
              format: email

    # ---------- 通用结构 ----------
    Error:
      type: object
      description: 统一错误格式
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 错误码
            message:
              type: string
              description: 可展示的错误说明
            field:
              type: string
              description: 校验失败的字段路径，仅参数校验错误时出现
    Pagination:
      type: object
      description: 列表响应的分页信息
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总条数
    GenerationStatus:
      type: object
      description: |
        AI 异步生成状态。终态为 ready / insufficient_data / failed；非终态 pending。
        两类资源的兜底语义不同（api-design-unified.md 0.3 节）：
        - 建议（Recommendation）：LLM 失败时降级为 template 兜底并仍返回 ready，
          generation.source = template。**不应出现 failed**——任何情况下用户都拿得到内容。
        - 复盘（Summary）：不做模板兜底，LLM 失败即 failed，提示稍后再试。
          **不应出现 source = template**。
        本 schema 为两者共用的超集；实现方需按资源类型约束上述互斥组合，
        调用方渲染时以资源类型 + status + source 三者共同判断。
      required: [status]
      properties:
        status:
          type: string
          description: 生成状态
          enum: [pending, ready, insufficient_data, failed]
        source:
          $ref: '#/components/schemas/GenerationSource'
        completedAt:
          type: string
          format: date-time
          description: 生成完成时间，终态时出现
    RatingFeedback:
      type: object
      description: 建议 / 复盘的有用性反馈请求体
      required: [rating]
      properties:
        rating:
          $ref: '#/components/schemas/Rating'
        reason:
          type: string
          maxLength: 100
          nullable: true
          description: 可选，≤100 字，补充为什么不准
    FeedbackRecord:
      type: object
      description: 已提交的反馈
      required: [rating, submittedAt]
      properties:
        rating:
          $ref: '#/components/schemas/Rating'
        reason:
          type: string
          nullable: true
          description: 用户补充说明
        submittedAt:
          type: string
          format: date-time
          description: 提交时间

    # ---------- 用户与设置 ----------
    User:
      type: object
      description: 当前用户资料
      required: [userId, stage, grade, subjects, guardianAuthorization, onboardingCompleted]
      properties:
        userId:
          type: string
          description: 用户 ID
        stage:
          $ref: '#/components/schemas/Stage'
        grade:
          type: string
          description: 年级，如「初二」「高二」
        subjects:
          type: array
          description: 学科列表
          items:
            $ref: '#/components/schemas/Subject'
        guardianAuthorization:
          type: object
          description: 监护人授权状态
          required: [status]
          properties:
            status:
              type: string
              description: 授权状态
              enum: [pending, active, revoked, expired]
            expiresAt:
              type: string
              format: date-time
              description: 授权到期时间
        onboardingCompleted:
          type: boolean
          description: 是否已完成建档引导
    UserProfilePut:
      type: object
      description: 幂等建档请求体，字段全必填
      required: [stage, grade, subjects]
      properties:
        stage:
          $ref: '#/components/schemas/Stage'
        grade:
          type: string
          description: 年级，如「初二」「高二」
        subjects:
          type: array
          description: 学科枚举数组，1-10 项（Subject 枚举共 10 个取值，允许全选）
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Subject'
    UserProfilePatch:
      type: object
      description: 局部更新请求体，字段全可选
      properties:
        stage:
          $ref: '#/components/schemas/Stage'
        grade:
          type: string
          description: 年级，如「初二」「高二」
        subjects:
          type: array
          description: 学科枚举数组，1-10 项（Subject 枚举共 10 个取值，允许全选）
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Subject'
    Settings:
      type: object
      description: 用户设置。权重数值（α、β 及各子权重）不通过任何用户侧接口暴露（PRD 5.2）
      required: [aiWeightTuningEnabled, sendTextToAI, knowledgeAiEgressEnabled, updatedAt]
      properties:
        aiWeightTuningEnabled:
          type: boolean
          description: 是否启用 AI 自动调权，默认 true；关闭后固定使用默认权重
        sendTextToAI:
          type: boolean
          description: 是否允许自由文本出域，默认 false；关闭时仅用结构化特征生成
        knowledgeAiEgressEnabled:
          type: boolean
          description: 是否允许知识复盘 AI 出域（PRD 12.6），默认 false；关闭时知识复盘走本地规则模板
        updatedAt:
          type: string
          format: date-time
          description: 最近更新时间
    SettingsUpdate:
      type: object
      description: 设置更新请求体，至少传一项
      minProperties: 1
      properties:
        aiWeightTuningEnabled:
          type: boolean
          description: 默认 true；关闭后固定使用默认权重
        sendTextToAI:
          type: boolean
          description: 默认 false；关闭时目标描述等自由文本不出域，仅用结构化特征生成
        knowledgeAiEgressEnabled:
          type: boolean
          description: 默认 false；开启后知识复盘可用云端 LLM（经 EgressGuard 白名单）
    GuardianAuthorizationRequest:
      type: object
      description: 监护人邮箱与手机号二选一必填
      minProperties: 1
      properties:
        guardianEmail:
          type: string
          description: 监护人邮箱（与 guardianPhone 二选一）
        guardianPhone:
          type: string
          description: 监护人手机号（与 guardianEmail 二选一）

    # ---------- 学习目标 ----------
    GoalProgress:
      type: object
      description: 目标进度
      required: [plannedTasks, completedTasks, ratio]
      properties:
        plannedTasks:
          type: integer
          description: 已规划任务数
        completedTasks:
          type: integer
          description: 已完成任务数
        ratio:
          type: number
          description: 完成比例
    Goal:
      type: object
      description: 学习目标
      required: [goalId, type, subject, title, status, progress, createdAt]
      properties:
        goalId:
          type: string
          description: 目标 ID
        type:
          $ref: '#/components/schemas/GoalType'
        subject:
          $ref: '#/components/schemas/Subject'
        title:
          type: string
          description: 目标标题
        description:
          type: string
          nullable: true
          description: 目标补充描述
        targetDate:
          type: string
          format: date
          nullable: true
          description: 目标日期
        status:
          type: string
          description: 目标状态
          enum: [active, archived]
        outcome:
          type: string
          nullable: true
          description: |
            归档终态，仅 status=archived 时有值；active 时为 null。
            用于区分「已达成 / 已放弃 / 已过期」——status 的 active/archived 二值无法表达这个区分。
            前端已按可选字段读取（goals.ts），后端补齐前保持返回 null 即可，向后兼容。
          enum: [achieved, abandoned, expired]
        completionNote:
          type: string
          maxLength: 200
          nullable: true
          description: 目标完成总结（归档时可填），≤200 字；前端已按可选字段读取
        pointIds:
          type: array
          description: 目标绑定的知识点 ID（v2.2，可选，用于「建议先补」短板提示）
          items:
            type: string
        progress:
          $ref: '#/components/schemas/GoalProgress'
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    GoalSummary:
      type: object
      description: 列表中的目标条目
      required: [goalId, type, subject, title, status, progress]
      properties:
        goalId:
          type: string
          description: 目标 ID
        type:
          $ref: '#/components/schemas/GoalType'
        subject:
          $ref: '#/components/schemas/Subject'
        title:
          type: string
          description: 目标标题
        targetDate:
          type: string
          format: date
          nullable: true
          description: 目标日期
        status:
          type: string
          description: 目标状态
          enum: [active, archived]
        outcome:
          type: string
          nullable: true
          description: 归档终态，仅 archived 时有值；取值同 Goal.outcome
          enum: [achieved, abandoned, expired]
        completionNote:
          type: string
          maxLength: 200
          nullable: true
          description: 目标完成总结；取值同 Goal.completionNote
        progress:
          $ref: '#/components/schemas/GoalProgress'
    GoalCreate:
      type: object
      description: 创建目标请求体
      required: [type, subject, title]
      properties:
        type:
          $ref: '#/components/schemas/GoalType'
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          description: 所属学科，跨学科目标填 other
        title:
          type: string
          maxLength: 50
          description: ≤50 字，如「两周后期中考试数学 120+」
        description:
          type: string
          maxLength: 200
          description: 可选，≤200 字自由文本，出域受 sendTextToAI 控制
        targetDate:
          type: string
          format: date
          description: 可选，短期目标建议必填
        templateId:
          type: string
          description: 可选，从预设模板创建时带上
    GoalUpdate:
      type: object
      description: 更新 / 归档目标请求体，字段全可选
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 50
          description: 目标标题
        description:
          type: string
          maxLength: 200
          description: 目标补充描述
        targetDate:
          type: string
          format: date
          description: 目标日期
        status:
          type: string
          description: active / archived（归档代替删除）
          enum: [active, archived]
    GoalList:
      type: object
      description: 目标列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GoalSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ---------- 学习计划 ----------
    PlanTask:
      type: object
      description: 计划内的单个任务
      required: [taskId, subject, topic, estimatedMinutes, priority, status]
      properties:
        taskId:
          type: string
          description: 任务 ID
        subject:
          $ref: '#/components/schemas/Subject'
        topic:
          type: string
          description: 内容方向，颗粒度到「学科 + 方向」，不含具体题目
        estimatedMinutes:
          type: integer
          description: 预计时长（分钟）
        priority:
          type: integer
          description: 优先级，数字越小越靠前
        status:
          $ref: '#/components/schemas/TaskStatus'
        goalId:
          type: string
          nullable: true
          description: 关联目标 ID；无关联时为 null
    PlanTaskDetail:
      allOf:
        - $ref: '#/components/schemas/PlanTask'
        - type: object
          description: 任务调整后的返回结构
          required: [removed, userAdjusted, updatedAt]
          properties:
            removed:
              type: boolean
              description: 是否已被用户删除（软删除，保留反馈信号）
            userAdjusted:
              type: boolean
              description: 是否被用户手动调整过，作为算法反馈信号
            updatedAt:
              type: string
              format: date-time
              description: 更新时间
    PlanTaskUpdate:
      type: object
      description: 调整任务请求体，至少传一项
      minProperties: 1
      properties:
        estimatedMinutes:
          type: integer
          description: 用户手动改时长
        status:
          $ref: '#/components/schemas/TaskStatus'
        removed:
          type: boolean
          description: true 表示删除该任务（软删除，保留反馈信号）
    PlanAdaptation:
      type: object
      description: 本次计划基于哪次状态评估做了强度调整；新用户无历史数据时整体为 null
      required: [assessmentId, stateLabel, adjustment, note]
      properties:
        assessmentId:
          type: string
          description: 依据的状态评估 ID
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        adjustment:
          type: string
          description: 调整方向，如 reduce_load
        note:
          type: string
          description: 面向用户的调整说明
    Plan:
      type: object
      description: 学习计划
      required: [planId, planDate, availableMinutes, tasks, createdAt]
      properties:
        planId:
          type: string
          description: 计划 ID
        planDate:
          type: string
          format: date
          description: 计划归属日期
        availableMinutes:
          type: integer
          description: 本次可用学习时间（分钟）
        adaptedFrom:
          allOf:
            - $ref: '#/components/schemas/PlanAdaptation'
          nullable: true
          description: 新用户无历史数据时为 null
        tasks:
          type: array
          description: 任务列表
          items:
            $ref: '#/components/schemas/PlanTask'
        createdAt:
          type: string
          format: date-time
          description: 生成时间
    PlanCreate:
      type: object
      description: 生成计划请求体
      required: [planDate, availableMinutes]
      properties:
        planDate:
          type: string
          format: date
          description: 计划归属日期
        availableMinutes:
          type: integer
          minimum: 10
          maximum: 600
          description: 本次可用学习时间，10-600 分钟
        goalIds:
          type: array
          description: 可选，关联目标；不传则使用全部 active 目标
          items:
            type: string
        regenerate:
          type: boolean
          default: false
          description: 可选，默认 false；true 覆盖当日已有计划
    PlanList:
      type: object
      description: 计划列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ---------- 学习记录 ----------
    RecordBehavior:
      type: object
      description: 行为数据（系统自动记录为主）
      required: [completion]
      properties:
        completion:
          $ref: '#/components/schemas/Completion'
        accuracy:
          type: number
          minimum: 0
          maximum: 1
          description: 可选，正确率 0-1；无客观测验时不传，服务端将该项权重归零重分配
        interruptions:
          type: integer
          default: 0
          description: 可选，中断次数，默认 0
        blurCount:
          type: integer
          description: 可选，页面失焦次数（小程序弱信号），客户端自动采集
    RecordSelfReport:
      type: object
      description: 自评数据，控制在 10 秒内完成
      required: [focus, fatigue, emotion, difficultyFeel]
      properties:
        focus:
          type: integer
          minimum: 1
          maximum: 5
          description: 专注度 1-5
        fatigue:
          type: integer
          minimum: 1
          maximum: 5
          description: 疲劳度 1-5
        emotion:
          $ref: '#/components/schemas/Emotion'
        difficultyFeel:
          $ref: '#/components/schemas/DifficultyFeel'
    RecordInput:
      type: object
      description: 提交学习记录请求体
      required: [subject, startedAt, durationMinutes, behavior, selfReport]
      properties:
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          description: 状态按学科分开评估，故必填
        startedAt:
          type: string
          format: date-time
          description: 学习开始时间
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 600
          description: 实际学习时长，1-600
        planTaskId:
          type: string
          description: 可选，关联计划任务；自由学习可不传
        behavior:
          $ref: '#/components/schemas/RecordBehavior'
        selfReport:
          $ref: '#/components/schemas/RecordSelfReport'
        note:
          type: string
          maxLength: 100
          description: 可选，≤100 字备注，出域受 sendTextToAI 控制
        skipRecommendation:
          type: boolean
          default: false
          description: 可选，默认 false；true 时不自动生成建议
    LearningRecord:
      type: object
      description: 已保存的学习记录
      required: [recordId, subject, startedAt, durationMinutes, behavior, selfReport, createdAt]
      properties:
        recordId:
          type: string
          description: 记录 ID
        subject:
          $ref: '#/components/schemas/Subject'
        startedAt:
          type: string
          format: date-time
          description: 学习开始时间
        durationMinutes:
          type: integer
          description: 实际学习时长
        planTaskId:
          type: string
          nullable: true
          description: 关联的计划任务；自由学习为 null
        behavior:
          $ref: '#/components/schemas/RecordBehavior'
        selfReport:
          $ref: '#/components/schemas/RecordSelfReport'
        note:
          type: string
          maxLength: 100
          nullable: true
          description: |
            用户备注，回读 RecordInput.note；未填写时为 null。
            此前 RecordInput 有 note 入参但 LearningRecord 出参缺失，用户无法找回自己写过的内容，已补齐。
        createdAt:
          type: string
          format: date-time
          description: 提交时间
    AssessmentSnapshot:
      type: object
      description: |
        提交/删除记录后同步重算得到的状态快照。
        数据不足（dataSufficient=false）时 assessmentId 为 null，且不输出 windowScore / trend ——
        与 StateResult（GET /assessments/current）的语义完全一致，两处对同一状态只有一种表示。
        此前本 schema 将三个字段定义为必填且不可空，与 StateResult 及 PRD 5.2「数据不足时不强行输出结论」矛盾，
        已对齐修复；放宽必填性不破坏已按旧契约实现的调用方。
      required: [subject, stateLabel, dataSufficient, recordCount]
      properties:
        assessmentId:
          type: string
          nullable: true
          description: 状态评估 ID；数据不足时为 null
        subject:
          $ref: '#/components/schemas/Subject'
        windowScore:
          type: number
          minimum: 0
          maximum: 1
          description: 滑动窗口状态分（0-1）；数据不足时不返回
        trend:
          $ref: '#/components/schemas/Trend'
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        dataSufficient:
          type: boolean
          description: 数据是否充足；false 时不下结论
        recordCount:
          type: integer
          description: 窗口内记录数
    LearningRecordCreated:
      allOf:
        - $ref: '#/components/schemas/LearningRecord'
        - type: object
          description: 提交成功后附带的状态快照与建议句柄
          required: [assessment]
          properties:
            assessment:
              $ref: '#/components/schemas/AssessmentSnapshot'
            recommendation:
              type: object
              nullable: true
              description: 自动创建的建议生成任务；skipRecommendation=true 时为 null
              required: [recommendationId, status]
              properties:
                recommendationId:
                  type: string
                  description: 建议 ID，用于轮询 GET /recommendations/{id}
                status:
                  type: string
                  description: 生成状态；此句柄只出现在刚创建时，取值恒为 pending
                  enum: [pending]
    LearningRecordList:
      type: object
      description: 学习记录列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LearningRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'
    LearningRecordDeleted:
      type: object
      description: 删除记录后的响应，含重算后的状态
      required: [deleted, recordId, recalculatedAssessment]
      properties:
        deleted:
          type: boolean
          description: 是否删除成功
        recordId:
          type: string
          description: 被删除的记录 ID
        recalculatedAssessment:
          $ref: '#/components/schemas/AssessmentSnapshot'

    # ---------- 状态评估 ----------
    StateBasedOn:
      type: object
      description: 可解释性依据（PRD 8.3），不暴露权重与公式
      required: [recordIds, signals]
      properties:
        recordIds:
          type: array
          description: 参与计算的记录 ID
          items:
            type: string
        signals:
          type: array
          description: 面向用户的信号说明
          items:
            type: string
    StateResult:
      type: object
      description: 单学科当前状态结果；数据不足时 assessmentId 为 null 且不输出 windowScore / trend
      required: [subject, stateLabel, displayText, dataSufficient, recordCount, windowSize]
      properties:
        assessmentId:
          type: string
          nullable: true
          description: 状态评估 ID；数据不足时为 null
        subject:
          $ref: '#/components/schemas/Subject'
        windowScore:
          type: number
          minimum: 0
          maximum: 1
          description: 滑动窗口状态分（0-1），数据不足时不返回
        trend:
          $ref: '#/components/schemas/Trend'
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        displayText:
          type: string
          description: 面向用户的自然语言说明
        dataSufficient:
          type: boolean
          description: 数据是否充足
        recordCount:
          type: integer
          description: 窗口内记录数
        windowSize:
          type: integer
          description: 滑动窗口长度
        basedOn:
          $ref: '#/components/schemas/StateBasedOn'
        computedAt:
          type: string
          format: date-time
          description: 计算时间
    StateResultList:
      type: object
      description: 当前状态响应；不传 subject 时返回全部学科（不做跨学科加权综合）
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StateResult'
    AssessmentHistoryPoint:
      type: object
      description: 趋势曲线上的单个数据点
      required: [date, windowScore, stateLabel, trend]
      properties:
        date:
          type: string
          format: date
          description: 日期
        windowScore:
          type: number
          minimum: 0
          maximum: 1
          description: 当日窗口状态分（0-1）
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        trend:
          $ref: '#/components/schemas/Trend'
    AssessmentHistory:
      type: object
      description: 状态历史响应
      required: [subject, items]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentHistoryPoint'
    AssessmentFeedback:
      type: object
      description: 「这个判断准不准」反馈请求体
      required: [accurate]
      properties:
        accurate:
          type: boolean
          description: 判断是否准确

    # ---------- 个性化建议 ----------
    RecommendationItem:
      type: object
      description: 单条建议
      required: [title, content]
      properties:
        title:
          type: string
          description: 建议标题
        content:
          type: string
          description: 建议正文，口语化且贴合本次学习情况
    RecommendationBasedOn:
      type: object
      description: 建议的生成依据（PRD 6.5 留痕）
      required: [stateLabel, explain]
      properties:
        assessmentId:
          type: string
          description: 依据的状态评估 ID
        recordId:
          type: string
          description: 依据的学习记录 ID
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        explain:
          type: string
          description: 面向用户的依据说明
    Recommendation:
      type: object
      description: 建议详情；生成中时 items 为 null，兜底时 generation.source 为 template 但结构一致
      required: [recommendationId, scene, generation]
      properties:
        recommendationId:
          type: string
          description: 建议 ID
        scene:
          $ref: '#/components/schemas/RecScene'
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          nullable: true
          description: 关联学科
        generation:
          $ref: '#/components/schemas/GenerationStatus'
        items:
          type: array
          nullable: true
          description: 建议内容；生成中为 null
          items:
            $ref: '#/components/schemas/RecommendationItem'
        basedOn:
          $ref: '#/components/schemas/RecommendationBasedOn'
        feedback:
          allOf:
            - $ref: '#/components/schemas/FeedbackRecord'
          nullable: true
          description: 用户反馈；未反馈时为 null
    RecommendationPending:
      type: object
      description: 手动请求建议后的受理响应
      required: [recommendationId, scene, generation, createdAt]
      properties:
        recommendationId:
          type: string
          description: 建议 ID，用于轮询
        scene:
          $ref: '#/components/schemas/RecScene'
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          nullable: true
          description: 关联学科
        generation:
          $ref: '#/components/schemas/GenerationStatus'
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    RecommendationCreate:
      type: object
      description: 手动请求生成建议请求体
      required: [scene]
      properties:
        scene:
          $ref: '#/components/schemas/RecScene'
        subject:
          allOf:
            - $ref: '#/components/schemas/Subject'
          description: 可选，post_session 场景建议必填
        recordId:
          type: string
          description: 可选，post_session 场景关联的学习记录
    RecommendationList:
      type: object
      description: 建议列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        pagination:
          $ref: '#/components/schemas/Pagination'
    RecommendationFeedbackResult:
      type: object
      description: 建议反馈提交结果
      required: [recommendationId, feedback]
      properties:
        recommendationId:
          type: string
          description: 建议 ID
        feedback:
          $ref: '#/components/schemas/FeedbackRecord'

    # ---------- 学习总结与复盘 ----------
    SummaryContent:
      type: object
      description: 复盘固定输出框架（PRD 5.4），数据不足时整体为 null
      required: [overview, patterns, suggestions, encouragement]
      properties:
        overview:
          type: string
          description: 这段时间的状态概览
        patterns:
          type: array
          description: 观察到的规律
          items:
            type: string
        suggestions:
          type: array
          description: 下阶段建议，可直接落到计划调整
          items:
            type: string
        encouragement:
          type: string
          description: 一句鼓励性收尾
    SummaryDataPoints:
      type: object
      description: 复盘引用的数据点；数据不足时返回 recordCount 与 minRequired
      properties:
        recordCount:
          type: integer
          description: 区间内记录数
        subjects:
          type: array
          description: 覆盖的学科
          items:
            $ref: '#/components/schemas/Subject'
        planCompletionRatio:
          type: number
          description: 计划完成比例
        referencedAssessmentIds:
          type: array
          description: 引用的状态评估 ID
          items:
            type: string
        minRequired:
          type: integer
          description: 生成复盘所需的最小记录数，数据不足时出现
    Summary:
      type: object
      description: 复盘详情
      required: [summaryId, generation]
      properties:
        summaryId:
          type: string
          description: 复盘 ID
        dimension:
          type: string
          description: 复盘维度（板块二知识复盘 = knowledge；板块一状态与规划 = state_and_plan）
          enum: [state_and_plan, knowledge]
          default: state_and_plan
        periodStart:
          type: string
          format: date
          description: 起始日期
        periodEnd:
          type: string
          format: date
          description: 结束日期
        generation:
          $ref: '#/components/schemas/GenerationStatus'
        content:
          allOf:
            - $ref: '#/components/schemas/SummaryContent'
          nullable: true
          description: 数据不足或生成失败时为 null
        dataPoints:
          $ref: '#/components/schemas/SummaryDataPoints'
        message:
          type: string
          description: 数据不足时的提示文案
        feedback:
          allOf:
            - $ref: '#/components/schemas/FeedbackRecord'
          nullable: true
          description: 用户反馈；未反馈时为 null
    SummaryPending:
      type: object
      description: 手动触发复盘后的受理响应
      required: [summaryId, periodStart, periodEnd, generation, createdAt]
      properties:
        summaryId:
          type: string
          description: 复盘 ID，用于轮询
        periodStart:
          type: string
          format: date
          description: 起始日期
        periodEnd:
          type: string
          format: date
          description: 结束日期
        generation:
          $ref: '#/components/schemas/GenerationStatus'
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    SummaryCreate:
      type: object
      description: 手动触发复盘请求体
      required: [periodStart, periodEnd]
      properties:
        periodStart:
          type: string
          format: date
          description: 起始日期
        periodEnd:
          type: string
          format: date
          description: 结束日期，区间长度 3-31 天
    SummaryList:
      type: object
      description: 复盘列表响应
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Summary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SummaryFeedbackResult:
      type: object
      description: 复盘反馈提交结果
      required: [summaryId, feedback]
      properties:
        summaryId:
          type: string
          description: 复盘 ID
        feedback:
          $ref: '#/components/schemas/FeedbackRecord'

    # ==================== 板块二：学科知识库（PRD 12.3.1） ====================
    KnowledgeSubject:
      type: object
      description: 已启用学科（kb_subjects）
      required: [subjectCode, name, pointCount, version]
      properties:
        subjectCode:
          type: string
          description: 学科代码（math/physics/english）
        name:
          type: string
          description: 学科显示名
        gradeBand:
          type: string
          description: 学段（junior/senior/other）
        pointCount:
          type: integer
          description: 已启用知识点数
        version:
          type: string
          description: 内容数据版本号
    KnowledgeSubjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSubject'
    KnowledgePoint:
      type: object
      description: 学科知识点（kb_points）
      required: [pointId, subjectCode, code, name, definition, difficulty, examWeight]
      properties:
        pointId:
          type: string
          description: 知识点 ID（kp_ 前缀）
        subjectCode:
          type: string
        code:
          type: string
          description: 知识点唯一代码，如 math.func.monotonicity
        name:
          type: string
        definition:
          type: string
          description: 概念定义
        parentId:
          type: string
          nullable: true
          description: 父知识点 ID；构图谱树
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          description: 难度 1-5
        examWeight:
          type: number
          description: 考试权重（学科聚合掌握度占比用），0-1 的小数
        errorTip:
          type: string
          description: 易错点提示
    KnowledgePointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePoint'
    KnowledgePointRelationType:
      type: string
      description: 概念关系四类（PRD 12.3.3）
      enum: [prerequisite, derived, contrast, applied_in]
    KnowledgePointRelation:
      type: object
      required: [srcPointId, dstPointId, type]
      properties:
        srcPointId:
          type: string
        dstPointId:
          type: string
        type:
          $ref: '#/components/schemas/KnowledgePointRelationType'
        weight:
          type: number
          description: 关系权重 0-1
    KnowledgePointDetail:
      type: object
      required: [pointId]
      properties:
        pointId:
          type: string
        subjectCode:
          type: string
        code:
          type: string
        name:
          type: string
        definition:
          type: string
        parentId:
          type: string
          nullable: true
        difficulty:
          type: integer
        examWeight:
          type: number
        errorTip:
          type: string
        relations:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePointRelation'
    KnowledgeGraph:
      type: object
      description: 学科概念图谱（v2.1 树形占位；v2.3 全量力导向）
      required: [subjectCode, nodes, edges]
      properties:
        subjectCode:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePoint'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePointRelation'
    KnowledgePointMatch:
      type: object
      required: [pointId, name, confidence, matchedBy]
      properties:
        pointId:
          type: string
        name:
          type: string
        subjectCode:
          type: string
        confidence:
          type: number
          description: 匹配置信度 0-1
        matchedBy:
          type: string
          description: 匹配方式（embedding / keyword_fallback）
          enum: [embedding, keyword_fallback]
    KnowledgePointMatchList:
      type: object
      required: [items, matchedBy]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePointMatch'
        matchedBy:
          type: string
          enum: [embedding, keyword_fallback]

    # ==================== 板块二：错题本（PRD 12.3.2） ====================
    ErrorRecordCreate:
      type: object
      required: [subject, rawText]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        rawText:
          type: string
          maxLength: 4000
          description: 错题原文（仅本地，永不出域）
        studentAnswer:
          type: string
          maxLength: 4000
          description: 学生作答
        correctAnswer:
          type: string
          maxLength: 4000
          description: 正确答案
        errorType:
          type: string
          description: 错因分类，如 concept/calculation/careless
        errorNote:
          type: string
          maxLength: 4000
          description: 自述错因
        pointIds:
          type: array
          description: 用户确认关联的知识点 ID
          items:
            type: string
    ErrorRecordUpdate:
      type: object
      description: 错题局部更新，至少传一项
      minProperties: 1
      properties:
        errorType:
          type: string
        errorNote:
          type: string
          maxLength: 4000
        status:
          type: string
          enum: [open, resolved]
        pointIds:
          type: array
          items:
            type: string
    LinkedPoint:
      type: object
      required: [pointId, confidence]
      properties:
        pointId:
          type: string
        name:
          type: string
        confidence:
          type: number
    ErrorRecord:
      type: object
      required: [errorId, subject, rawText, status, createdAt]
      properties:
        errorId:
          type: string
        subject:
          $ref: '#/components/schemas/Subject'
        rawText:
          type: string
          maxLength: 4000
        studentAnswer:
          type: string
          nullable: true
        correctAnswer:
          type: string
          nullable: true
        errorType:
          type: string
          nullable: true
        errorNote:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, resolved]
        points:
          type: array
          items:
            $ref: '#/components/schemas/LinkedPoint'
        createdAt:
          type: string
          format: date-time
        lastReviewedAt:
          type: string
          format: date-time
          nullable: true
    ErrorBookList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ErrorRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ErrorRecordDeleted:
      type: object
      required: [deleted, errorId]
      properties:
        deleted:
          type: boolean
        errorId:
          type: string
    ReviewSubmit:
      type: object
      required: [recallCorrect]
      properties:
        recallCorrect:
          type: boolean
          description: 这次复习是否回忆正确
    ReviewResult:
      type: object
      required: [correct, nextReviewAt, intervalDays]
      properties:
        correct:
          type: boolean
        nextReviewAt:
          type: string
          format: date
          description: 下一次复习日期（回忆正确按 1/2/4/7/15 递进；错误回到 1 天）
        intervalDays:
          type: integer
          description: 下次复习间隔天数
    ErrorParseRequest:
      type: object
      description: 错题归因（合规形态）：引用已入库错题，原文不出域
      required: [errorId]
      properties:
        errorId:
          type: string
    ErrorParseResponse:
      type: object
      required: [parse, source, basedOn]
      properties:
        parse:
          type: string
          description: 归因分析文案
        source:
          type: string
          enum: [llm, template]
        basedOn:
          type: array
          description: 检索到的知识点片段（名称，供前端展示依据）
          items:
            type: string

    # ==================== 板块二：知识点掌握（PRD 12.3.4） ====================
    PointMasteryResult:
      type: object
      required: [pointId, dataSufficient, sampleSize]
      properties:
        pointId:
          type: string
        mastery:
          type: number
          nullable: true
          description: 0-1 掌握度；样本 <3 时为 null
        dataSufficient:
          type: boolean
          description: 样本 >=3 才为 true
        sampleSize:
          type: integer
        factors:
          type: object
          description: 五因子明细（错误率/正确率/近度/保持/未解决），样本充足时出现
          additionalProperties:
            type: number
        updatedAt:
          type: string
          format: date-time
    SubjectMasteryResult:
      type: object
      required: [subjectCode, dataSufficient, sampleSize]
      properties:
        subjectCode:
          type: string
        mastery:
          type: number
          nullable: true
        dataSufficient:
          type: boolean
        sampleSize:
          type: integer
        points:
          type: array
          description: 子知识点掌握度贡献列表
          items:
            $ref: '#/components/schemas/PointMasteryResult'
    MasteryTimelinePoint:
      type: object
      required: [date, mastery]
      properties:
        date:
          type: string
          format: date
        mastery:
          type: number
          nullable: true
        sampleSize:
          type: integer
    MasteryTimeline:
      type: object
      required: [subjectCode, items]
      properties:
        subjectCode:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MasteryTimelinePoint'

    # ==================== 板块二：知识复盘（PRD 12.3.5） ====================
    KnowledgeSummaryCreate:
      type: object
      required: [periodStart, periodEnd, subject]
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
          description: 区间长度 3-31 天
        subject:
          $ref: '#/components/schemas/Subject'

    # ==================== 契约漂移补录 schema ====================
    DailySummary:
      type: object
      required: [date, summary]
      properties:
        date:
          type: string
          format: date
        summary:
          type: string
          description: 一句话总结（≤60 字）
    WeightSnapshot:
      type: object
      required: [alpha, beta, w1, w2, w3, w4, w5, w6]
      properties:
        alpha: { type: number }
        beta: { type: number }
        w1: { type: number }
        w2: { type: number }
        w3: { type: number }
        w4: { type: number }
        w5: { type: number }
        w6: { type: number }
    WeightAdjustLogItem:
      type: object
      required: [id, before, after, reason, reverted, effectiveAt]
      properties:
        id: { type: string }
        before:
          $ref: '#/components/schemas/WeightSnapshot'
        after:
          $ref: '#/components/schemas/WeightSnapshot'
        reason: { type: string }
        reverted: { type: boolean }
        revertReason: { type: string, nullable: true }
        effectiveAt:
          type: string
          format: date-time
    WeightConfig:
      type: object
      required: [current, updatedAt, recentLogs]
      properties:
        current:
          $ref: '#/components/schemas/WeightSnapshot'
        updatedAt:
          type: string
          format: date-time
        recentLogs:
          type: array
          items:
            $ref: '#/components/schemas/WeightAdjustLogItem'
    TuneNowResult:
      type: object
      required: [tuned, message]
      properties:
        tuned: { type: boolean }
        message: { type: string }
    StateBreakdown:
      type: object
      required:
        - subject
        - windowScore
        - behaviorSubAvg
        - selfReportSubAvg
        - recordCount
        - windowSize
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        windowScore:
          type: number
          nullable: true
        behaviorSubAvg: { type: number }
        selfReportSubAvg: { type: number }
        behaviorContribution: { type: number }
        selfReportContribution: { type: number }
        behaviorShare: { type: number }
        selfReportShare: { type: number }
        recordCount: { type: integer }
        stateLabel:
          $ref: '#/components/schemas/StateLabel'
        trend:
          $ref: '#/components/schemas/Trend'
        signals:
          type: array
          items: { type: string }
        weights:
          $ref: '#/components/schemas/WeightSnapshot'
        windowSize: { type: integer }
    RecommendationContent:
      type: object
      required: [eligible, recordCount, recentWindowDays, reason, fromLLM]
      properties:
        eligible: { type: boolean }
        recordCount: { type: integer }
        recentWindowDays: { type: integer }
        subject:
          $ref: '#/components/schemas/Subject'
        topic: { type: string, nullable: true }
        reason: { type: string }
        fromLLM: { type: boolean }
