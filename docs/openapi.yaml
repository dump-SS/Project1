  /assessments/current:
    get:
      tags: [状态评估]
      operationId: getCurrentAssessments
      summary: 获取当前状态与标签 ④
      description: |
        状态分是记录的派生资源，不提供 POST 手动计算接口——提交/删除记录时自动重算，
        保证「分数始终由固定公式计算」（PRD 6.1），也避免前端伪造触发。
        不传 subject 时返回全部学科的数组（PRD 5.2：不做跨学科加权综合）。
        basedOn 落实 PRD 8.3 可解释性，但不暴露权重与公式；冷启动时输出 insufficient_data，不下结论。
      parameters:
        - name: subject
          in: query
          required: false
          description: 不传返回全部学科
          schema:
            $ref: '#/components/schemas/Subject'
      responses:
        '200':
          description: 当前状态列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResultList'
              example:
                items:
                  - assessmentId: a_7742
                    subject: math
                    windowScore: 0.48
                    trend: down
                    stateLabel: fatigue_warning
                    displayText: 最近几次数学状态有点走低，疲劳感比较明显
                    dataSufficient: true
                    recordCount: 7
                    windowSize: 7
                    basedOn:
                      recordIds: [r_88012, r_87990, r_87944]
                      signals:
                        - 自评疲劳度连续 3 次 ≥4
                        - 练习正确率较上周下降
                    computedAt: '2026-08-16T19:46:00+08:00'
                  - assessmentId: null
                    subject: english
                    stateLabel: insufficient_data
                    displayText: 数据积累中，再记录几次就能给出判断
                    dataSufficient: false
                    recordCount: 2
                    windowSize: 7
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

