                      suggestions:
                        - 把数学挪到下午或晚饭后早一点的时段试一周
                        - 下周数学总时长先降到本周的 80%，稳住再加
                      encouragement: 状态有起伏很正常，你这周把 7 次记录都填完了，这个坚持挺难得。
