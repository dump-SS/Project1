        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 记录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRecordList'
              example:
                items:
                  - recordId: r_88012
                    subject: math
                    startedAt: '2026-08-16T19:00:00+08:00'
                    durationMinutes: 45
                    planTaskId: t_30011
                    behavior:
                      completion: partial
                      accuracy: 0.62
                      interruptions: 3
                      blurCount: 5
                    selfReport:
                      focus: 2
                      fatigue: 4
                      emotion: negative
                      difficultyFeel: hard
                    createdAt: '2026-08-16T19:46:00+08:00'
