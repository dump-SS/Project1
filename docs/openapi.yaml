openapi: 3.0.3
info:
  title: 学习状态智能助手 API（板块一 + 板块二 MVP）
  version: 1.7.0
  description: |
    中学学情导学与状态评估 API。

    来源：`docs/api-design-unified.md`（唯一生效版本），对应 `PRD-学习状态智能助手.md`。
    本文件严格按该设计文档生成，未引入文档之外的字段。

    主流程：创建目标 ① → 生成计划 ② → 提交学习记录 ③ → 计算状态 ④ → 返回建议 ⑤（外加周期复盘与反馈回路）。

    约定要点：
    - 所有资源以当前 token 用户为作用域，不设 userId 路径参数，不存在跨用户读取接口。
    - 写接口可选携带 `Idempotency-Key` 头，24 小时内重复键直接返回首次结果。
    - 建议与复盘为异步生成：POST 返回 202 + `generation.status = pending`，前端轮询 GET 获取结果。
    - 监护人授权失效时所有写接口返回 403 `GUARDIAN_AUTHORIZATION_EXPIRED`，读接口不受影响。

    阶段口径：pilot。本文档为前后端与 QA 的唯一契约来源。项目当前处于 pilot 阶段（小范围试用验证，非 beta/正式发布），由学生团队维持。板块三契约已于 M1 转正（口径见 docs/module3-m0-decision-proposal.md v1.7 §4.11）。

    **v1.6.0（重构 M0 · 契约冻结）**——本次为重构第一阶段的契约增量，未改动任何既有字段名：
    - **稳定用户 ID 落地（D59）**：`User.userId` 语义明确为稳定内部主键（`u_` 前缀），与登录凭证
      解耦；`AuthMeResponse.user` 增补可选 `userId`（`email` 保留，前端展示仍用它）。
    - **新增 M0 实体 schema**：Exam / Collection / CollectionItem / UsageLedgerEntry / InviteCode /
      ViolationLog / ErrorReport / Medal / UserProfileEntry / TopicSummary / Explanation /
      ChatSession / ChatRawMessage。⚠️ 这些 schema **尚未挂到任何 path**，接口由各板块按里程碑补齐；
      字段名以本节为准，各板块不得另起。
    - **题本升格（D48）**：新增 `ErrorCause` / `ErrorIntent` 两个正交维度，`ErrorRecord` 系列扩展
      `errorCause` / `intent` / `sourceExamId` 三个可选字段（`errorType` 保留为自由文本，向后兼容）。
    - **目标（D6 / D49）**：`Goal` / `GoalSummary` / `GoalCreate` / `GoalUpdate` 增补
      `parentGoalId`（父子树）、`examId` + `targetScore`（引用考试）。`status` 的 enum 未改动。
    - **OCR 路线已彻底放弃**（#32）：契约本就没有 /ocr 路径，本次删除后端 501 占位实现。
    - **游客态口径**（与全局 security 的关系）：生产环境无有效会话一律 401 `UNAUTHENTICATED`，
      **不再兜底共享账号** `u_10237`。因此游客的「试用」**不走后端接口**——纯前端本地状态，
      不落库、不串号；登录/注册成功后试用数据直接清空（D1/D43）。A 板块落地时在此口径上叠加，
      **不得新增任何「游客可写」的接口**。

servers:
  - url: /api/v1
    description: 基础路径，下文所有 URL 均省略此前缀

security:
  - sessionCookie: []

tags:
  - name: 鉴权会话
    description: |
      邮箱验证码 / 密码登录、注册、找回密码、会话查询与登出。
      登录成功后服务端通过 Set-Cookie 下发 HttpOnly Session Cookie（sid），
      后续所有业务接口凭该 Cookie 鉴权（浏览器自动携带）。
      对应实现见 mock-server/server.js 与前端 authApi.js。
  - name: 用户与设置
    description: 用户资料、AI 相关开关、监护人授权（合规底线，PRD 8.1）
  - name: 学习目标
    description: 流程环节 ① 创建目标
  - name: 学习计划
    description: 流程环节 ② 生成计划（规则引擎同步返回，不走 LLM）
  - name: 学习记录
    description: 流程环节 ③ 提交学习记录（同步回状态快照 + 建议句柄）
  - name: 状态评估
    description: 流程环节 ④ 计算状态（派生资源，无 POST 手动计算接口）
  - name: 个性化建议
    description: 流程环节 ⑤ 返回建议（异步生成 + 模板兜底）
  - name: 学习总结与复盘
    description: 周期复盘（异步生成，不做模板兜底）
  - name: 学科知识库
    description: |
      板块二（PRD v1.4 第 12 节）：学科知识点只读浏览、概念关联图谱、文本匹配知识点。
      全部需登录；数据来源于 kb_subjects / kb_points / kb_point_relations。
  - name: 错题本
    description: |
      板块二：错题录入（原文只在本地 embedding，永不出域）、CRUD、软删、间隔复习。
      错题原文/作答/正确答案/自述错因属 knowledge_raw，按 PRD 12.6 禁止出域（CI 断言）。
  - name: 知识点掌握
    description: 板块二：mastery 五因子规则计算（公式固定、权重入库），样本不足时不下数值结论。
  - name: 知识复盘
    description: 板块二：学科级周期知识复盘（异步生成 + RAG + EgressGuard + 审核层），复用 summaries 表。
  - name: 群体参照
    description: |
      板块三（pilot）：匿名群体参照。只上传匿名分桶特征（服务端抽取为唯一真源）、只下发聚合结果
      （k≥20 才下发，不含个体值）。授权默认关闭、显式开启、可随时撤回（撤回即物理删除）。

paths:
  # ==================== 鉴权会话（外部账号体系，登录前公开） ====================
  # 以下 /auth/* 接口在登录前调用，逐个用 security: [] 覆盖全局 Cookie 要求。
  # 请求/响应结构对齐 mock-server/server.js 与 frontend/src/services/authApi.js。
  /auth/send-register-code:
    post:
      tags: [鉴权会话]
      operationId: sendRegisterCode
      summary: 发送注册邮箱验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
            example:
              email: student@example.com
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: 邮箱已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_ALREADY_REGISTERED
                  message: 该邮箱已注册，请直接登录
                  field: email
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/send-login-code:
    post:
      tags: [鉴权会话]
      operationId: sendLoginCode
      summary: 发送登录邮箱验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
            example:
              email: student@example.com
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/EmailNotRegistered'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/send-reset-code:
    post:
      tags: [鉴权会话]
      operationId: sendResetCode
      summary: 发送重置密码邮箱验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
            example:
              email: student@example.com
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/EmailNotRegistered'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      tags: [鉴权会话]
      operationId: register
      summary: 注册（验证码 + 密码，成功后不自动登录）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: student@example.com
              code: '123456'
              password: Abc12345
              confirmPassword: Abc12345
      responses:
        '200':
          description: 注册成功，请前往登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: 邮箱已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_ALREADY_REGISTERED
                  message: 该邮箱已注册，请直接登录
                  field: email
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login-email-code:
    post:
      tags: [鉴权会话]
      operationId: loginByEmailCode
      summary: 邮箱验证码登录（成功后 Set-Cookie 下发会话）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginByCodeRequest'
            example:
              email: student@example.com
              code: '123456'
      responses:
        '200':
          description: 登录成功，响应头 Set-Cookie 下发 sid（HttpOnly）
          headers:
            Set-Cookie:
              description: 'sid=<token>; HttpOnly; Path=/; SameSite=Lax; Max-Age=604800'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/EmailNotRegistered'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login-password:
    post:
      tags: [鉴权会话]
      operationId: loginByPassword
      summary: 邮箱密码登录（成功后 Set-Cookie 下发会话）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginByPasswordRequest'
            example:
              email: student@example.com
              password: Abc12345
      responses:
        '200':
          description: 登录成功，响应头 Set-Cookie 下发 sid（HttpOnly）
          headers:
            Set-Cookie:
              description: 'sid=<token>; HttpOnly; Path=/; SameSite=Lax; Max-Age=604800'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: 密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PASSWORD_INCORRECT
                  message: 密码错误
                  field: password
        '404':
          $ref: '#/components/responses/EmailNotRegistered'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/verify-reset-code:
    post:
      tags: [鉴权会话]
      operationId: verifyResetCode
      summary: 校验重置密码验证码（找回密码第一步）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginByCodeRequest'
            example:
              email: student@example.com
              code: '123456'
      responses:
        '200':
          description: 验证码有效，可进入设置新密码步骤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/EmailNotRegistered'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password:
    post:
      tags: [鉴权会话]
      operationId: resetPassword
      summary: 重置密码（找回密码第二步，重置后已有会话失效）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              email: student@example.com
              code: '123456'
              newPassword: Xyz98765
              confirmPassword: Xyz98765
      responses:
        '200':
          description: 密码已重置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/EmailNotRegistered'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/me:
    get:
      tags: [鉴权会话]
      operationId: getAuthMe
      summary: 查询当前会话用户（前端据此判断登录态）
      responses:
        '200':
          description: 已登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
              example:
                ok: true
                user:
                  email: student@example.com
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags: [鉴权会话]
      operationId: logout
      summary: 退出登录（清除会话 Cookie）
      responses:
        '200':
          description: 已退出，响应头清空 sid
          headers:
            Set-Cookie:
              description: 'sid=; HttpOnly; Path=/; SameSite=Lax; Max-Age=0'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    get:
      tags: [用户与设置]
      operationId: getMe
      summary: 获取当前用户资料
      description: 前端据此判断是否需要引导建档。
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                userId: u_10237
                stage: senior
                grade: 高二
                subjects: [SX, YY, WL]
                guardianAuthorization:
                  status: active
                  expiresAt: '2026-09-10T00:00:00+08:00'
                onboardingCompleted: true
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [用户与设置]
      operationId: putMe
      summary: 初始化用户资料（幂等建档，字段全必填）
      description: 新用户 onboarding 的全量建档语义。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfilePut'
            example:
              stage: senior
              grade: 高二
              subjects: [SX, YY, WL]
      responses:
        '200':
          description: 建档后的用户对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                userId: u_10237
                stage: senior
                grade: 高二
                subjects: [SX, YY, WL]
                guardianAuthorization:
                  status: active
                  expiresAt: '2026-09-10T00:00:00+08:00'
                onboardingCompleted: true
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GuardianAuthorizationExpired'
    patch:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [用户与设置]
      operationId: patchMe
      summary: 更新用户资料（局部更新，字段全可选）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfilePatch'
            example:
              subjects: [SX, YY, WL, HX]
      responses:
        '200':
          description: 更新后的用户对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                userId: u_10237
                stage: senior
                grade: 高二
                subjects: [SX, YY, WL, HX]
                guardianAuthorization:
                  status: active
                  expiresAt: '2026-09-10T00:00:00+08:00'
                onboardingCompleted: true
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GuardianAuthorizationExpired'

  /me/settings:
    get:
      tags: [用户与设置]
      operationId: getSettings
      summary: 读取用户设置
      description: |
        承载 PRD 5.2「关闭 AI 自动调权」与 6.2「不发送我的文字内容」两个必须的用户开关。
        权重数值（α、β 及各子权重）不通过任何用户侧接口暴露。
      responses:
        '200':
          description: 当前设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              example:
                aiWeightTuningEnabled: true
                sendTextToAI: false
                updatedAt: '2026-08-16T09:12:00+08:00'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [用户与设置]
      operationId: patchSettings
      summary: 更新用户设置（至少传一项）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
            example:
              sendTextToAI: true
      responses:
        '200':
          description: 更新后的设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              example:
                aiWeightTuningEnabled: true
                sendTextToAI: true
                updatedAt: '2026-08-16T09:30:00+08:00'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GuardianAuthorizationExpired'

  /me/guardian-authorization:
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [用户与设置]
      operationId: submitGuardianAuthorization
      summary: 提交监护人联系方式并发送确认请求
      description: 监护人邮箱与手机号二选一必填（PRD 8.1 合规底线）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianAuthorizationRequest'
            example:
              guardianEmail: guardian@example.com
      responses:
        '202':
          description: 确认请求已发送，等待监护人点击链接确认
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    delete:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [用户与设置]
      operationId: revokeGuardianAuthorization
      summary: 撤销监护人授权（账号进入只读）
      responses:
        '204':
          description: 已撤销，账号进入只读状态
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /guardian-authorization/confirm:
    get:
      tags: [用户与设置]
      operationId: confirmGuardianAuthorization
      summary: 监护人点击链接确认授权（无需登录）
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: 确认链接中的一次性令牌
          schema:
            type: string
      responses:
        '200':
          description: 授权确认成功
        '500':
