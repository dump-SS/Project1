  /learning-records:
    post:
      tags: [学习记录]
      operationId: createLearningRecord
      summary: 提交学习记录（核心接口）③④
      description: |
        行为数据 + 10 秒内可完成的自评一次性提交。状态分是确定性规则计算（PRD 5.2），
        同步重算并在响应中带回状态快照；同时自动创建一条 post_session 建议生成任务，
        返回其 recommendationId（pending），前端拿着它去 GET /recommendations/{id} 轮询即可。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInput'
            example:
              subject: math
              startedAt: '2026-08-16T19:00:00+08:00'
              durationMinutes: 45
              planTaskId: t_30011
              behavior:
                completion: partial
                accuracy: 0.62
                interruptions: 3
                blurCount: 5
              selfReport:
                focus: 2
                fatigue: 4
                emotion: negative
                difficultyFeel: hard
              note: 函数图像那块看不太进去
      responses:
        '201':
          description: 提交成功，含同步重算的状态快照与建议句柄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRecordCreated'
              example:
                recordId: r_88012
                subject: math
                startedAt: '2026-08-16T19:00:00+08:00'
                durationMinutes: 45
                planTaskId: t_30011
                behavior:
                  completion: partial
                  accuracy: 0.62
                  interruptions: 3
                  blurCount: 5
                selfReport:
                  focus: 2
                  fatigue: 4
                  emotion: negative
                  difficultyFeel: hard
                assessment:
                  assessmentId: a_7742
                  subject: math
                  windowScore: 0.48
                  trend: down
                  stateLabel: fatigue_warning
                  dataSufficient: true
                  recordCount: 7
                recommendation:
                  recommendationId: rec_20301
                  status: pending
                createdAt: '2026-08-16T19:46:00+08:00'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GuardianAuthorizationExpired'
    get:
      tags: [学习记录]
      operationId: listLearningRecords
      summary: 学习记录列表
      parameters:
        - name: subject
          in: query
          required: false
