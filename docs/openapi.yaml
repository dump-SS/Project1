  /summaries:
    post:
      tags: [学习总结与复盘]
      operationId: createSummary
      summary: 手动触发生成复盘
      description: |
        周复盘由后台定时任务自动创建，无需客户端调用；本接口供用户手动生成指定区间的总结，
        有每日次数上限，超限 429（PRD 5.4 控成本）。复盘不做模板兜底，失败即 failed。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
