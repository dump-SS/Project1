              $ref: '#/components/schemas/SummaryCreate'
            example:
              periodStart: '2026-08-10'
              periodEnd: '2026-08-16'
      responses:
        '202':
          description: 生成任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryPending'
              example:
                summaryId: sum_4402
                periodStart: '2026-08-10'
                periodEnd: '2026-08-16'
                generation:
                  status: pending
                createdAt: '2026-08-16T22:00:00+08:00'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GuardianAuthorizationExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
