          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GuardianAuthorizationExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [个性化建议]
      operationId: listRecommendations
      summary: 建议列表
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: scene
          in: query
          required: false
          description: 场景过滤
          schema:
            $ref: '#/components/schemas/RecScene'
        - name: subject
          in: query
          required: false
          description: 学科过滤
          schema:
            $ref: '#/components/schemas/Subject'
