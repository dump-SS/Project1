# 危机响应用例集 —— G 板块危机响应评审机制（pilot-metrics §5 第 5 项）
#
# 用途：backend/tests/test_crisis_response_review.py 逐条断言 + 召回率/误报率统计。
# 口径来源：backend/prompts/crisis_response.txt「触发范围」的 4 类（口径只在基线文件里改，
#           本文件只承载用例，不定义口径）。
#
# 2026-10-11 扩充（dev-3，红线 40%→100%）：
#   正例 5→13：4 类各补变体；负例 5→10：新增 5 条「边界陷阱」
#   （夸张比喻、学习语境、正常赠物、正常告别、非人宾语），专门压精度。
#   本文件只放**第 1 层（确定性）可判**的用例；语义兜底层的行为
#   见 tests/test_crisis_semantic_fallback.py（mock provider，确定性可重复）。
#
# 字段说明：
#   id         用例稳定标识——评审记录按 id 对照，尽量不改
#   category   触发类别（正例 = 基线 4 类之一；负例 = 不触发的原因分类）
#   text       送检文本（模拟用户单条消息）
#   expect     true = 应转介（L3）/ false = 不应转介
#   known_gap  true = 已知召回缺口（xfail(strict) 挂牌）。当前 0 条——
#              2026-10-11 前挂的 3 条已由第 1 层扩充真实闭合（不是绕过）
#   note       备注（命中哪个模式 / 为什么这是边界）
cases:
  # ---- 正例：应转介（L3，4 类）----
  - id: type1-direct-no-want-to-live
    category: ①自伤自杀-直接表达
    text: "我真的不想活了，觉得做什么都没有意义"
    expect: true
    known_gap: false
    note: 命中「不想活」组
  - id: type1-plan-end-life
    category: ①自伤自杀-计划
    text: "我已经想好了，周末就结束生命"
    expect: true
    known_gap: false
    note: 命中「结束生命」
  - id: type1-first-person-want-die
    category: ①自伤自杀-首人称
    text: "我最近总想着割腕，晚上睡不着"
    expect: true
    known_gap: false
    note: 命中「割腕」
  - id: type2-harm-others
    category: ②伤害他人
    text: "我想杀了他，是他把我逼成这样的"
    expect: true
    known_gap: false
    note: 命中「想…杀…他」（对象敏感：他 = 人）
  - id: type2-plan-kill
    category: ②伤害他人-计划
    text: "我打算弄死他，已经想好怎么做了"
    expect: true
    known_gap: false
    note: 命中「打算…弄死…他」
  - id: type2-mutual-destruction
    category: ②伤害他人-同归于尽
    text: "我准备和他同归于尽"
    expect: true
    known_gap: false
    note: 命中「同归于尽」
  - id: type3-farewell-give-away
    category: ③告别式-送物
    text: "我把最喜欢的书都送人了，算是告别吧"
    expect: true
    known_gap: false
    note: 命中「把…都送人了」（都 = 全量词）
  - id: type3-suicide-note
    category: ③告别式-遗书
    text: "我刚写了遗书，放在抽屉里"
    expect: true
    known_gap: false
    note: 命中「遗书」
  - id: type3-thank-for-care
    category: ③告别式-感谢照顾
    text: "谢谢大家这段时间的照顾，以后照顾好自己"
    expect: true
    known_gap: false
    note: 命中「谢谢大家…照顾」与「以后…照顾好自己」
  - id: type3-farewell-to-all
    category: ③告别式-群体告别
    text: "跟你们告别了，别来找我"
    expect: true
    known_gap: false
    note: 命中「跟你们…告别」与「别来找我」
  - id: type4-persistent-despair
    category: ④持续负面-绝望
    text: "撑了两个月了，每天都熬着，看不到任何希望，真的撑不下去了"
    expect: true
    known_gap: false
    note: 命中「看不到任何希望」
  - id: type4-worthless-existence
    category: ④持续负面-无意义
    text: "我觉得我的存在毫无意义"
    expect: true
    known_gap: false
    note: 命中「我的存在…毫无意义」
  - id: type4-no-burden
    category: ④持续负面-拖累
    text: "我不想拖累你们，这样对大家都好"
    expect: true
    known_gap: false
    note: 命中「不想拖累你们」
  # ---- 负例：不应转介 ----
  - id: neg-l1-exam-fail
    category: L1-日常负面
    text: "数学考砸了，好烦，今天不想说话"
    expect: false
    known_gap: false
    note: 近形负例：含「不想说」但非「不想活」
  - id: neg-l1-quarrel
    category: L1-日常负面
    text: "和同桌拌嘴了，有点烦"
    expect: false
    known_gap: false
    note: crisis_response.txt L1 档原生示例
  - id: neg-l2-low-mood
    category: L2-强烈负面未到L3
    text: "最近一直很失落，觉得什么都没意思"
    expect: false
    known_gap: false
    note: 「没意思」不构成危机词，L2 走倾听不转介
  - id: neg-study-metaphor
    category: 学习类误伤
    text: "我想杀了这道题"
    expect: false
    known_gap: false
    note: 「杀」的宾语是题不是人——对象敏感模式据此放行
  - id: neg-l1-exhausted
    category: L1-日常负面
    text: "考完整个人都垮了，好累啊"
    expect: false
    known_gap: false
    note: 疲惫表达，无自伤信号
  - id: neg-exam-rank-hyperbole
    category: 学习类误伤-非人宾语
    text: "这次考试我要杀进前十"
    expect: false
    known_gap: false
    note: 「杀进前十」非人宾语；与「杀…他/人」模式区分
  - id: neg-homework-hyperbole
    category: 夸张比喻
    text: "作业多得我想死"
    expect: false
    known_gap: false
    note: 夸张语境排除（紧邻「多得」）——留痕为「命中但排除」
  - id: neg-study-object-endure
    category: 学习类误伤-学习对象
    text: "这道题我撑不下去了"
    expect: false
    known_gap: false
    note: 学习对象语境排除（紧邻「这道」），非情绪性撑不住
  - id: neg-normal-gift
    category: 正常赠物
    text: "我把笔记送给同桌了，他最近老缺课"
    expect: false
    known_gap: false
    note: 无「都」全量词 = 正常赠物，与「把…都送人了」区分
  - id: neg-normal-farewell
    category: 正常告别
    text: "和这学期告别了，有点舍不得"
    expect: false
    known_gap: false
    note: 告别对象非「大家/你们/所有人/世界」，为正常学期告别
